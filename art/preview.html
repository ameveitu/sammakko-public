<style>
  :root { --paper: #f7f3e7; --ink: #173f3b; --line: #244868; --muted: #5f6f6b; --card: #fffdf7; --edge: #e2dccb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; } h2 { margin: 36px 0 12px; font-size: 19px; }
  p.note { color: var(--muted); margin: 0 0 16px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 10px; text-align: center; }
  .card small { display: block; color: var(--muted); font-size: 12px; }
  .stage { height: 150px; position: relative; overflow: hidden; background: linear-gradient(#fffdf7 70%, #eee6cf 70%); border-radius: 8px; }
  .stage img { position: absolute; left: 50%; bottom: 0; width: 150px; height: 150px; margin-left: -75px; transform-origin: 50% 93%; }
  .tex { height: 150px; border-radius: 8px; background-size: 128px 128px; }
  .bg img { width: 100%; border-radius: 8px; display: block; }
  .icon img { width: 72px; height: 72px; }
  .score { font-weight: 600; } .ok { color: #2d7a3e; } .warn { color: #a05a00; }
  .bggrid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  label { font-size: 13px; color: var(--muted); }
</style>
