services:
  sammakko:
    build: .
    image: sammakko-site:${SAMMAKKO_RELEASE:-local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${SAMMAKKO_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/release.json"]
      interval: 30s
      timeout: 5s
      retries: 3
