worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    application/json json;
    text/markdown md;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/webp webp;
    image/x-icon ico;
    font/woff2 woff2;
    audio/mpeg mp3;
    audio/wav wav;
  }
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/markdown;
  server {
    listen 8080;
    server_name _;
    # Keep redirects on the visitor's HTTPS origin when a reverse proxy terminates TLS.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # The release is small and may be replaced atomically. Revalidate versioned JSON,
    # HTML and unversioned lesson modules together to prevent mixed releases.
    add_header Cache-Control no-cache always;
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
    # Lite audio files carry a content hash in their name (tools/audiogen pack), so they never
    # change in place. Only these get a long immutable cache; manifest.json and HTML revalidate.
    # A location-level add_header replaces the server-level ones, so the security headers repeat.
    location ~ "^/lite/audio/.+\.[0-9a-f]{10}\.(mp3|wav)$" {
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }
  }
}
