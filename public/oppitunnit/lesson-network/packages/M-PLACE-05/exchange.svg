<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 145" role="img" aria-label="3 sataa ja 4 kymppiä; yhteensä 340."><g font-family="sans-serif" text-anchor="middle" fill="#183e36"><rect x="8" y="14" width="164" height="72" rx="5" fill="#d3e8d9" stroke="#467766"/><rect x="188" y="14" width="164" height="72" rx="5" fill="#e3edf2" stroke="#467766"/><text x="90" y="58" font-size="26">3 × 100</text><text x="270" y="58" font-size="26">4 × 10</text><text x="180" y="129" font-size="25">300 + 40 = 340</text></g></svg>
