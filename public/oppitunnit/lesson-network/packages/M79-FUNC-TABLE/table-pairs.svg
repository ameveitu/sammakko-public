<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-labelledby="title desc"><title id="title">Pöydistä arvotaulukon pariksi</title><desc id="desc">Kaksi pöytää ja neljä tuolia sekä yksi ohjaajan tuoli. Syöte 2 muuttuu säännöllä tulokseksi 5. Pari kirjataan samalle riville.</desc><rect width="420" height="460" rx="14" fill="#faf8f1"/><text x="210" y="30" font-family="sans-serif" font-size="22" fill="#183e36" text-anchor="middle">Kaksi tuolia joka pöydälle</text><rect x="53" y="90" width="84" height="56" rx="6" fill="#e3bd83" stroke="#6c573e" stroke-width="2"/><rect x="78" y="60" width="34" height="21" rx="4" fill="#b8d4e5" stroke="#32596a" stroke-width="2"/><rect x="78" y="161" width="34" height="21" rx="4" fill="#b8d4e5" stroke="#32596a" stroke-width="2"/><rect x="198" y="90" width="84" height="56" rx="6" fill="#e3bd83" stroke="#6c573e" stroke-width="2"/><rect x="223" y="60" width="34" height="21" rx="4" fill="#b8d4e5" stroke="#32596a" stroke-width="2"/><rect x="223" y="161" width="34" height="21" rx="4" fill="#b8d4e5" stroke="#32596a" stroke-width="2"/><rect x="352" y="105" width="34" height="24" rx="4" fill="#f2cc66" stroke="#745e2a" stroke-width="2"/><text x="365" y="160" font-family="sans-serif" font-size="22" fill="#183e36" text-anchor="middle">+1</text><text x="210" y="215" font-family="sans-serif" font-size="21" fill="#183e36" text-anchor="middle">4 tuolia + 1 tuoli = 5 tuolia</text><path d="M210 230V260M202 251L210 260L218 251" fill="none" stroke="#45685e" stroke-width="3"/><text x="210" y="290" font-family="sans-serif" font-size="22" fill="#183e36" text-anchor="middle">x = 2 → 2 · 2 + 1 → y = 5</text><path d="M210 305V330M202 321L210 330L218 321" fill="none" stroke="#45685e" stroke-width="3"/><rect x="90" y="343" width="240" height="94" fill="#eaf0e6" stroke="#45685e" stroke-width="2"/><path d="M210 343V437M90 387H330" stroke="#45685e" stroke-width="2"/><text x="150" y="374" font-family="sans-serif" font-size="18" fill="#183e36" text-anchor="middle">x: pöytiä</text><text x="270" y="374" font-family="sans-serif" font-size="18" fill="#183e36" text-anchor="middle">y: tuoleja</text><text x="150" y="422" font-family="sans-serif" font-size="26" fill="#183e36" text-anchor="middle">2</text><text x="270" y="422" font-family="sans-serif" font-size="26" fill="#183e36" text-anchor="middle">5</text></svg>