<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-labelledby="title desc"><title id="title">Sama kanisteri, eri vesimäärä</title><desc id="desc">Suoraseinäiseen 8 litran kanisteriin lisätään kaksi litraa minuutissa. Ajoissa nolla, kaksi ja neljä minuuttia on nolla, neljä ja kahdeksan litraa. Kanisterin mitat pysyvät samoina.</desc><rect width="660" height="250" fill="#faf8f1"/><g fill="#60b1c9"><rect x="280" y="110" width="100" height="80"/><rect x="490" y="30" width="100" height="160"/></g><g fill="none" stroke="#183e36" stroke-width="3"><path d="M70 30V190H170V30M280 30V190H380V30M490 30V190H590V30"/></g><g font-family="sans-serif" fill="#183e36" text-anchor="middle" font-size="22"><text x="120" y="220">0 min: 0 l</text><text x="330" y="220">2 min: 4 l</text><text x="540" y="220">4 min: 8 l</text><text x="330" y="22">Sama 20 cm korkea kanisteri</text></g></svg>
