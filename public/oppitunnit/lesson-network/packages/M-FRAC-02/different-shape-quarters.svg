<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350" role="img" aria-labelledby="title desc"><title id="title">Eri muotoiset neljäsosat</title><desc id="desc">Kokonaisen neliön neljä yhtä suurta aluetta ovat kaksi neliötä ja kaksi kolmiota. Apuruudukko tukee koon vertailua.</desc><polygon data-quarter="0" points="48,48 160,48 160,160 48,160" fill="#fffaf0" stroke="#183e36" stroke-width="3"/><polygon data-quarter="1" points="160,48 272,48 272,160 160,160" fill="#fffaf0" stroke="#183e36" stroke-width="3"/><polygon data-quarter="2" points="48,160 272,160 272,272" fill="#245f4c" stroke="#183e36" stroke-width="3"/><polygon data-quarter="3" points="48,160 272,272 48,272" fill="#fffaf0" stroke="#183e36" stroke-width="3"/><path d="M104 48v224M48 104h224" fill="none" stroke="#81968b" stroke-width="1" stroke-dasharray="3 4"/><path d="M160 48v224M48 160h224" fill="none" stroke="#81968b" stroke-width="1" stroke-dasharray="3 4"/><path d="M216 48v224M48 216h224" fill="none" stroke="#81968b" stroke-width="1" stroke-dasharray="3 4"/><text x="160" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">Koko neliö on kokonainen</text><text x="160" y="309" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">Neljä yhtä suurta aluetta.</text><text x="160" y="340" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">Merkitty kolmio on 1/4.</text></svg>
