<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 410" role="img" aria-labelledby="title desc"><title id="title">Kokonainen, valitut osat ja merkintä</title><desc id="desc">Koko nauhassa viisi yhtä suurta osaa, kolme merkitty: kolme viidesosaa. Toinen kokonainen on neliö, jonka neljästä yhtä suuresta osasta yksi on merkitty.</desc><text x="160" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#183e36">Yksi kokonainen nauha</text><rect x="20" y="52" width="56" height="54" fill="#245f4c" stroke="#183e36" stroke-width="2"/><path d="M32 79l9 9 16-20" fill="none" stroke="#fff" stroke-width="4"/><text x="48" y="131" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">1</text><rect x="76" y="52" width="56" height="54" fill="#fffaf0" stroke="#183e36" stroke-width="2"/><text x="104" y="131" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">2</text><rect x="132" y="52" width="56" height="54" fill="#245f4c" stroke="#183e36" stroke-width="2"/><path d="M144 79l9 9 16-20" fill="none" stroke="#fff" stroke-width="4"/><text x="160" y="131" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">3</text><rect x="188" y="52" width="56" height="54" fill="#fffaf0" stroke="#183e36" stroke-width="2"/><text x="216" y="131" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">4</text><rect x="244" y="52" width="56" height="54" fill="#245f4c" stroke="#183e36" stroke-width="2"/><path d="M256 79l9 9 16-20" fill="none" stroke="#fff" stroke-width="4"/><text x="272" y="131" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">5</text><text x="160" y="164" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">3 valittua, 5 osaa yhteensä</text><text x="160" y="207" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183e36">3/5 · kolme viidesosaa</text><text x="160" y="246" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">Uusi kokonainen: neliö</text><rect x="60" y="267" width="60" height="60" fill="#245f4c" stroke="#183e36" stroke-width="2"/><rect x="120" y="267" width="60" height="60" fill="#fffaf0" stroke="#183e36" stroke-width="2"/><rect x="60" y="327" width="60" height="60" fill="#fffaf0" stroke="#183e36" stroke-width="2"/><rect x="120" y="327" width="60" height="60" fill="#fffaf0" stroke="#183e36" stroke-width="2"/><text x="248" y="308" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#183e36">1/4</text><text x="248" y="339" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">yksi</text><text x="248" y="365" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">neljäsosa</text></svg>
