<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="title desc"><title id="title">Mallista vihkoon</title><desc id="desc">Kuvitteellinen penkki: lehti. Kiven vieri: kukka. Samat tiedot mallivihkossa.</desc><text x="160" y="27" text-anchor="middle" fill="#183e36" font-size="18">Kuvitteelliset mallihavainnot</text><rect x="10" y="42" width="300" height="103" rx="8" fill="#edf3ef"/><text x="25" y="75" fill="#183e36" font-size="18">Penkki</text><path data-mark="leaf" d="M247 78Q245 57 274 60Q275 84 247 78Z" fill="#68936a" stroke="#183e36" stroke-width="2"/><text x="25" y="121" fill="#183e36" font-size="18">Kiven vieri</text><path d="M260 117v16" stroke="#3d7456" stroke-width="3"/><circle cx="260" cy="111" r="12" fill="#d99c84" stroke="#183e36" stroke-width="2"/><circle cx="260" cy="111" r="4" fill="#f0d57d"/><path d="M160 151v24m-7-8l7 8 7-8" fill="none" stroke="#245f4c" stroke-width="3"/><rect x="10" y="187" width="300" height="102" rx="8" fill="#fffaf0" stroke="#183e36" stroke-width="2"/><text x="25" y="215" fill="#183e36" font-size="18">Mallivihko</text><text x="25" y="246" fill="#183e36" font-size="18">Penkki: lehti</text><text x="25" y="276" fill="#183e36" font-size="18">Kiven vieri: kukka</text></svg>
