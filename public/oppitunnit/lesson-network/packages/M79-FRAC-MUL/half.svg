<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-label="2 riviä ja 4 saraketta, 8 yhtä suurta osaa kokonaisesta. 3 osaa valittuna."><defs><pattern id="fraction-selected" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#275e54"/><path d="M0 8L8 0" stroke="#cee3d6" stroke-width="1.5"/></pattern></defs><rect data-selected="1" x="60" y="35" width="60" height="90" fill="url(#fraction-selected)" stroke="#355c55" stroke-width="1.5"/><rect data-selected="1" x="120" y="35" width="60" height="90" fill="url(#fraction-selected)" stroke="#355c55" stroke-width="1.5"/><rect data-selected="1" x="180" y="35" width="60" height="90" fill="url(#fraction-selected)" stroke="#355c55" stroke-width="1.5"/><rect data-selected="0" x="240" y="35" width="60" height="90" fill="#fffdf5" stroke="#355c55" stroke-width="1.5"/><rect data-selected="0" x="60" y="125" width="60" height="90" fill="#a5cddc" stroke="#355c55" stroke-width="1.5"/><rect data-selected="0" x="120" y="125" width="60" height="90" fill="#a5cddc" stroke="#355c55" stroke-width="1.5"/><rect data-selected="0" x="180" y="125" width="60" height="90" fill="#a5cddc" stroke="#355c55" stroke-width="1.5"/><rect data-selected="0" x="240" y="125" width="60" height="90" fill="#fffdf5" stroke="#355c55" stroke-width="1.5"/><text x="180" y="250" text-anchor="middle" font-size="21" fill="#173e39">3 / 8 = 3/8</text></svg>
