<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" role="img" aria-labelledby="t d"><title id="t">Rivi, sarake ja risteys</title><desc id="d">Loikan rivin ja Eväs-sarakkeen risteyksessä on Leipä. Aavan eväs on Omena. Molempien juoma on Vesi.</desc><rect x="5" y="172" width="310" height="58" fill="#d3e7ee"/><rect x="207" y="56" width="108" height="174" fill="#f5d387"/><rect x="207" y="172" width="108" height="58" fill="#dfdbc1" stroke="#203e48" stroke-width="4"/><g fill="none" stroke="#203e48" stroke-width="2"><path d="M5 56h310v174H5zM5 114h310M5 172h310M99 56v174M207 56v174"/></g><g font-family="sans-serif" font-size="21" fill="#203e48" text-anchor="middle"><text x="160" y="30">Retkieväät</text><text x="52" y="92">Kuka</text><text x="153" y="92">Juoma</text><text x="261" y="92">Eväs ↓</text><text x="52" y="151">Aava</text><text x="153" y="151">Vesi</text><text x="261" y="151">Omena</text><text x="52" y="208">Loikka</text><text x="153" y="208">Vesi</text><text x="261" y="208" font-weight="bold">Leipä</text><text x="160" y="261">Loikan rivi →</text><text x="160" y="287">Eväs-sarake ↓</text></g></svg>