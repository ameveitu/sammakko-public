<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" role="img"><title>Neljä marjaa saa kukin yhden sanan</title><desc>Jokaisesta marjasta lähtee yksi viiva omaan lukusanaan: yksi, kaksi, kolme, neljä. Yksikään marja ei jää ilman viivaa.</desc><rect width="320" height="330" rx="16" fill="#fffdf7"/><text x="160" y="29" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#183e36">Yksi sana jokaiselle</text><circle cx="58" cy="72" r="17" fill="#b53f52" stroke="#522e38" stroke-width="2"/><path d="M58 55 q-4 -11 8 -14" fill="none" stroke="#245f4c" stroke-width="3"/><path d="M86 72 H156" stroke="#245f4c" stroke-width="2"/><rect x="166" y="53" width="115" height="38" rx="7" fill="#e0eee5"/><text x="224" y="79" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">yksi</text><circle cx="58" cy="136" r="17" fill="#b53f52" stroke="#522e38" stroke-width="2"/><path d="M58 119 q-4 -11 8 -14" fill="none" stroke="#245f4c" stroke-width="3"/><path d="M86 136 H156" stroke="#245f4c" stroke-width="2"/><rect x="166" y="117" width="115" height="38" rx="7" fill="#e0eee5"/><text x="224" y="143" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">kaksi</text><circle cx="58" cy="200" r="17" fill="#b53f52" stroke="#522e38" stroke-width="2"/><path d="M58 183 q-4 -11 8 -14" fill="none" stroke="#245f4c" stroke-width="3"/><path d="M86 200 H156" stroke="#245f4c" stroke-width="2"/><rect x="166" y="181" width="115" height="38" rx="7" fill="#e0eee5"/><text x="224" y="207" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">kolme</text><circle cx="58" cy="264" r="17" fill="#b53f52" stroke="#522e38" stroke-width="2"/><path d="M58 247 q-4 -11 8 -14" fill="none" stroke="#245f4c" stroke-width="3"/><path d="M86 264 H156" stroke="#245f4c" stroke-width="2"/><rect x="166" y="245" width="115" height="38" rx="7" fill="#e0eee5"/><text x="224" y="271" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">neljä</text></svg>
