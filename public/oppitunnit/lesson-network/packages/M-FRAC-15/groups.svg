<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Samat viidesosapalat kolmesta annoksesta yhteen</title><g fill="#183e36" font-family="sans-serif"><text x="180" y="27" text-anchor="middle" font-size="20">Ennen: 3 annosta, kukin 2/5</text><rect x="15.0" y="52" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="33.0" y="52" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="51.0" y="52" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="69.0" y="52" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="87.0" y="52" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="135.0" y="52" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="153.0" y="52" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="171.0" y="52" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="189.0" y="52" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="207.0" y="52" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="255.0" y="52" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="273.0" y="52" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="291.0" y="52" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="309.0" y="52" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="327.0" y="52" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><text x="180" y="118" text-anchor="middle" font-size="19">2 + 2 + 2 = 6 viidesosaa</text><text x="180" y="173" text-anchor="middle" font-size="20">Jälkeen: samat kuusi palaa</text><rect x="65.0" y="200" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="83.0" y="200" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="101.0" y="200" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="119.0" y="200" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="137.0" y="200" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="205.0" y="200" width="18.0" height="30" fill="#245f4c" stroke="#183e36"/><rect x="223.0" y="200" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="241.0" y="200" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="259.0" y="200" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><rect x="277.0" y="200" width="18.0" height="30" fill="#fffaf0" stroke="#183e36"/><text x="180" y="272" text-anchor="middle" font-size="23">3 × 2/5 = 6/5</text><text x="180" y="310" text-anchor="middle" font-size="18">Yksi kokonainen on samaa kokoa.</text></g></svg>
