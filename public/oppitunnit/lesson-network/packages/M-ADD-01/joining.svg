<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" role="img" aria-labelledby="title desc"><title id="title">Samat palat ennen yhdistämistä ja sen jälkeen</title><desc id="desc">Aluksi Loikalla kolme ja Aavalla kaksi palaa, lopuksi samat viisi yhteisessä korissa. Kukin pala kuuluu vain yhteen alkuperäiseen osaan.</desc><rect width="420" height="700" fill="#faf8f1"/><g font-family="sans-serif" fill="#183e36" font-size="20" text-anchor="middle"><text x="210" y="25">Aluksi kaksi osaa</text><text x="210" y="375">Lopuksi samat palat yhdessä</text></g><svg x="0" y="35" width="420" height="310" viewBox="0 0 420 310"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" role="img" aria-label="3 ja 2 palaa yhdistetään. Korissa nyt 0, ulkopuolella vielä 5. Yhteensä koko kuvassa 5 palaa."><g font-family="sans-serif" font-size="18" fill="#183e36"><text x="100" y="30" text-anchor="middle">Loikan osa: 3</text><text x="320" y="30" text-anchor="middle">Aavan osa: 2</text><path d="M64 185H356L340 286H80Z" fill="#f0dfb9" stroke="#725b34" stroke-width="3"/><text x="210" y="173" text-anchor="middle">Yhteinen kori</text><g data-piece="0" data-part="0" data-joined="false"><circle cx="42" cy="78" r="13" fill="#9c482f" stroke="#183e36" stroke-width="2"/></g><g data-piece="1" data-part="0" data-joined="false"><circle cx="79" cy="78" r="13" fill="#9c482f" stroke="#183e36" stroke-width="2"/></g><g data-piece="2" data-part="0" data-joined="false"><circle cx="116" cy="78" r="13" fill="#9c482f" stroke="#183e36" stroke-width="2"/></g><g data-piece="3" data-part="1" data-joined="false"><circle cx="262" cy="78" r="13" fill="#315f87" stroke="#183e36" stroke-width="2"/></g><g data-piece="4" data-part="1" data-joined="false"><circle cx="299" cy="78" r="13" fill="#315f87" stroke="#183e36" stroke-width="2"/></g><text x="210" y="307" text-anchor="middle">Korissa nyt: 0</text></g></svg></svg><svg x="0" y="385" width="420" height="310" viewBox="0 0 420 310"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" role="img" aria-label="3 ja 2 palaa yhdistetään. Korissa nyt 5, ulkopuolella vielä 0. Yhteensä koko kuvassa 5 palaa."><g font-family="sans-serif" font-size="18" fill="#183e36"><text x="100" y="30" text-anchor="middle">Loikan osa: 3</text><text x="320" y="30" text-anchor="middle">Aavan osa: 2</text><path d="M64 185H356L340 286H80Z" fill="#f0dfb9" stroke="#725b34" stroke-width="3"/><text x="210" y="173" text-anchor="middle">Yhteinen kori</text><g data-piece="0" data-part="0" data-joined="true"><circle cx="104" cy="226" r="13" fill="#9c482f" stroke="#183e36" stroke-width="2"/></g><g data-piece="1" data-part="0" data-joined="true"><circle cx="152" cy="226" r="13" fill="#9c482f" stroke="#183e36" stroke-width="2"/></g><g data-piece="2" data-part="0" data-joined="true"><circle cx="200" cy="226" r="13" fill="#9c482f" stroke="#183e36" stroke-width="2"/></g><g data-piece="3" data-part="1" data-joined="true"><circle cx="248" cy="226" r="13" fill="#315f87" stroke="#183e36" stroke-width="2"/></g><g data-piece="4" data-part="1" data-joined="true"><circle cx="296" cy="226" r="13" fill="#315f87" stroke="#183e36" stroke-width="2"/></g><text x="210" y="307" text-anchor="middle">Korissa nyt: 5</text></g></svg></svg></svg>
