<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" role="img"><title>Kuuden kiven laskukierros</title><desc>Ylhäältä alkaen myötäpäivään kuusi kiveä saa sanat yhdestä kuuteen. Aloituskivi on merkitty. Siihen ei palata laskemaan seitsemää.</desc><rect width="320" height="330" rx="16" fill="#fffdf7"/><text x="160" y="27" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Aloita tästä ↓</text><ellipse cx="160" cy="65" rx="29" ry="22" fill="#dbe3e4" stroke="#31545b" stroke-width="2"/><text x="160" y="72" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">1</text><ellipse cx="248" cy="112" rx="29" ry="22" fill="#dbe3e4" stroke="#31545b" stroke-width="2"/><text x="248" y="119" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">2</text><ellipse cx="248" cy="215" rx="29" ry="22" fill="#dbe3e4" stroke="#31545b" stroke-width="2"/><text x="248" y="222" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">3</text><ellipse cx="160" cy="265" rx="29" ry="22" fill="#dbe3e4" stroke="#31545b" stroke-width="2"/><text x="160" y="272" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">4</text><ellipse cx="72" cy="215" rx="29" ry="22" fill="#dbe3e4" stroke="#31545b" stroke-width="2"/><text x="72" y="222" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">5</text><ellipse cx="72" cy="112" rx="29" ry="22" fill="#dbe3e4" stroke="#31545b" stroke-width="2"/><text x="72" y="119" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">6</text><text x="160" y="156" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">yksi … kuusi</text><text x="160" y="184" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">sitten lopeta</text><text x="160" y="320" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Jokainen kivi kerran.</text></svg>
