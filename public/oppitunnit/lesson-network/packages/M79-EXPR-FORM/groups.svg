<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img"><title>Kolme ryhmää ja lisä kerran tai jokaisessa ryhmässä</title><g fill="#183e36" font-family="system-ui,sans-serif"><text x="180" y="24" text-anchor="middle" font-size="18">2 irtokorttia kerran</text><rect x="17" y="38" width="90" height="70" rx="7" fill="#fffaf0" stroke="#245f4c" stroke-width="2"/><text x="62" y="76" text-anchor="middle" font-size="24">n</text><rect x="127" y="38" width="90" height="70" rx="7" fill="#fffaf0" stroke="#245f4c" stroke-width="2"/><text x="172" y="76" text-anchor="middle" font-size="24">n</text><rect x="237" y="38" width="90" height="70" rx="7" fill="#fffaf0" stroke="#245f4c" stroke-width="2"/><text x="282" y="76" text-anchor="middle" font-size="24">n</text><text x="180" y="142" text-anchor="middle" font-size="24" fill="#a34d13">+ 2</text><text x="180" y="173" text-anchor="middle" font-size="24">3n + 2</text><text x="180" y="200" text-anchor="middle" font-size="18">2 lisäkorttia joka pussiin</text><rect x="17" y="214" width="90" height="70" rx="7" fill="#fffaf0" stroke="#245f4c" stroke-width="2"/><text x="62" y="252" text-anchor="middle" font-size="24">n + 2</text><rect x="127" y="214" width="90" height="70" rx="7" fill="#fffaf0" stroke="#245f4c" stroke-width="2"/><text x="172" y="252" text-anchor="middle" font-size="24">n + 2</text><rect x="237" y="214" width="90" height="70" rx="7" fill="#fffaf0" stroke="#245f4c" stroke-width="2"/><text x="282" y="252" text-anchor="middle" font-size="24">n + 2</text><text x="180" y="349" text-anchor="middle" font-size="24">3(n + 2) = 3n + 6</text></g></svg>
