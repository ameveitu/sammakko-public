<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" role="img"><title>Viimeinen sana neljä kertoo koko määrän</title><desc>Neljä marjaa on samassa kehyksessä. Niille annetaan sanat yksi, kaksi, kolme, neljä. Kehyksestä lähtevä nuoli osoittaa koko joukon määrään: neljä kaikkiaan.</desc><rect width="320" height="330" rx="16" fill="#fffdf7"/><text x="160" y="29" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#183e36">Laske ensin oikein</text><rect x="28" y="45" width="264" height="135" rx="15" fill="none" stroke="#245f4c" stroke-width="3"/><circle cx="61" cy="91" r="16" fill="#b53f52" stroke="#522e38" stroke-width="2"/><text x="61" y="143" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#183e36">yksi</text><circle cx="127" cy="91" r="16" fill="#b53f52" stroke="#522e38" stroke-width="2"/><text x="127" y="143" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#183e36">kaksi</text><circle cx="193" cy="91" r="16" fill="#b53f52" stroke="#522e38" stroke-width="2"/><text x="193" y="143" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#183e36">kolme</text><circle cx="259" cy="91" r="16" fill="#b53f52" stroke="#522e38" stroke-width="2"/><text x="259" y="143" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#183e36">neljä</text><path d="M160 182 V214 M153 204 L160 215 L167 204" fill="none" stroke="#245f4c" stroke-width="3"/><text x="160" y="249" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#183e36">NELJÄ KAIKKIAAN</text><text x="160" y="285" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Viimeinen sana kertoo</text><text x="160" y="310" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">koko joukon määrän.</text></svg>
