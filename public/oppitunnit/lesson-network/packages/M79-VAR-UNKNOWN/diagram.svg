<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-label="Rasian korttimäärä x ja viisi irrallista ovat yhteensä17. Ehdotus12 täyttää ehdon."><rect width="360" height="320" rx="12" fill="#fffdf6"/><text x="180" y="30" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">Tuntematon korttien määrä</text><rect x="22" y="55" width="100" height="90" rx="10" fill="#e1ece5" stroke="#315f53" stroke-width="3"/><text x="72" y="96" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#183e36">x</text><text x="72" y="123" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#183e36">korttia</text><text x="142" y="104" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#183e36">+</text><rect x="164" y="66" width="25" height="49" rx="3" fill="#f3dfba" stroke="#a24c20" stroke-width="2"/><rect x="195" y="83" width="25" height="49" rx="3" fill="#f3dfba" stroke="#a24c20" stroke-width="2"/><rect x="226" y="66" width="25" height="49" rx="3" fill="#f3dfba" stroke="#a24c20" stroke-width="2"/><rect x="257" y="83" width="25" height="49" rx="3" fill="#f3dfba" stroke="#a24c20" stroke-width="2"/><rect x="288" y="66" width="25" height="49" rx="3" fill="#f3dfba" stroke="#a24c20" stroke-width="2"/><text x="241" y="149" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">5 irrallista</text><path d="M22 174H334" stroke="#8da497" stroke-width="2"/><text x="180" y="205" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#183e36">x + 5 = 17</text><text x="180" y="237" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">x kertoo rasian korttien määrän.</text><rect x="32" y="257" width="296" height="42" rx="8" fill="#e1ece5"/><text x="180" y="285" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#183e36">Tarkistus: 12 + 5 = 17</text></svg>
