<svg xmlns="http://www.w3.org/2000/svg" width="320" height="355" viewBox="0 0 320 355" role="img"><title>Osista merkintään</title><desc>Kolmen ja kahden kiven osat muodostavat yhteensä viisi. 3+2=5 ja 5=2+3 ovat molemmat tosia merkintöjä samoista osista.</desc><rect width="320" height="355" rx="14" fill="#fffdf7"/><text x="160" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">Kaksi osaa, sama koko määrä</text><text x="160" y="53" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">Ensimmäinen osa: 3</text><circle cx="126.0" cy="75" r="10" fill="#315f53"/><circle cx="160.0" cy="75" r="10" fill="#315f53"/><circle cx="194.0" cy="75" r="10" fill="#315f53"/><text x="160" y="132" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">Toinen osa: 2</text><circle cx="143.0" cy="154" r="10" fill="#315f53"/><circle cx="177.0" cy="154" r="10" fill="#315f53"/><text x="160" y="223" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">Yhteensä: 5</text><circle cx="92.0" cy="245" r="10" fill="#315f53"/><circle cx="126.0" cy="245" r="10" fill="#315f53"/><circle cx="160.0" cy="245" r="10" fill="#315f53"/><circle cx="194.0" cy="245" r="10" fill="#315f53"/><circle cx="228.0" cy="245" r="10" fill="#315f53"/><text x="160" y="302" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#183e36">3 + 2 = 5</text><text x="160" y="335" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Myös 5 = 2 + 3 kertoo saman.</text></svg>
