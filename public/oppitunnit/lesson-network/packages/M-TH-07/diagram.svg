<svg xmlns="http://www.w3.org/2000/svg" width="320" height="345" viewBox="0 0 320 345" role="img"><title>Kaikki kahden pohjan ja kolmen merkin parit</title><desc>Kaksi riviä: raitapohja ja pistepohja. Kummassakin rivissä yhdistetään pohjaan ympyrä, kolmio ja tähti. Kuusi eri vaihtoehtoa, jokainen kerran.</desc><rect width="320" height="345" rx="14" fill="#fffdf7"/><text x="160" y="26" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">Pidä pohja, vaihda merkkiä</text><text x="160" y="57" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Raitapohja</text><rect x="24" y="65" width="76" height="58" rx="5" fill="#e4ede8" stroke="#315f53" stroke-width="2"/><path d="M30 77 H94" stroke="#9ab4a7" stroke-width="2"/><path d="M30 93 H94" stroke="#9ab4a7" stroke-width="2"/><path d="M30 109 H94" stroke="#9ab4a7" stroke-width="2"/><circle cx="62" cy="94" r="19" fill="#fffdf7"/><circle cx="62" cy="94" r="11" fill="#315f53"/><rect x="124" y="65" width="76" height="58" rx="5" fill="#e4ede8" stroke="#315f53" stroke-width="2"/><path d="M130 77 H194" stroke="#9ab4a7" stroke-width="2"/><path d="M130 93 H194" stroke="#9ab4a7" stroke-width="2"/><path d="M130 109 H194" stroke="#9ab4a7" stroke-width="2"/><circle cx="162" cy="94" r="19" fill="#fffdf7"/><polygon points="162,83 173,105 151,105" fill="#a34d13"/><rect x="224" y="65" width="76" height="58" rx="5" fill="#e4ede8" stroke="#315f53" stroke-width="2"/><path d="M230 77 H294" stroke="#9ab4a7" stroke-width="2"/><path d="M230 93 H294" stroke="#9ab4a7" stroke-width="2"/><path d="M230 109 H294" stroke="#9ab4a7" stroke-width="2"/><circle cx="262" cy="94" r="19" fill="#fffdf7"/><text x="262" y="102" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#183e36">★</text><text x="160" y="159" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Pistepohja</text><rect x="24" y="167" width="76" height="58" rx="5" fill="#e4ede8" stroke="#315f53" stroke-width="2"/><circle cx="36" cy="179" r="3" fill="#9ab4a7"/><circle cx="88" cy="179" r="3" fill="#9ab4a7"/><circle cx="36" cy="212" r="3" fill="#9ab4a7"/><circle cx="88" cy="212" r="3" fill="#9ab4a7"/><circle cx="62" cy="196" r="19" fill="#fffdf7"/><circle cx="62" cy="196" r="11" fill="#315f53"/><rect x="124" y="167" width="76" height="58" rx="5" fill="#e4ede8" stroke="#315f53" stroke-width="2"/><circle cx="136" cy="179" r="3" fill="#9ab4a7"/><circle cx="188" cy="179" r="3" fill="#9ab4a7"/><circle cx="136" cy="212" r="3" fill="#9ab4a7"/><circle cx="188" cy="212" r="3" fill="#9ab4a7"/><circle cx="162" cy="196" r="19" fill="#fffdf7"/><polygon points="162,185 173,207 151,207" fill="#a34d13"/><rect x="224" y="167" width="76" height="58" rx="5" fill="#e4ede8" stroke="#315f53" stroke-width="2"/><circle cx="236" cy="179" r="3" fill="#9ab4a7"/><circle cx="288" cy="179" r="3" fill="#9ab4a7"/><circle cx="236" cy="212" r="3" fill="#9ab4a7"/><circle cx="288" cy="212" r="3" fill="#9ab4a7"/><circle cx="262" cy="196" r="19" fill="#fffdf7"/><text x="262" y="204" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#183e36">★</text><text x="160" y="293" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#183e36">Jokainen pohja saa jokaisen merkin.</text><text x="160" y="326" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#183e36">Sama pari uudestaan ei ole uusi.</text></svg>
