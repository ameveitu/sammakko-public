<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 530" role="img" aria-labelledby="title desc"><title id="title">Kuvioiden ominaisuudet</title><desc id="desc">Kaksi erimuotoista kolmiota. Neliö ja suorakulmio. Alhaalla ympyrä sekä kaksi ei-kolmiota: avoin ja kaarevasivuinen kuvio.</desc><text x="160" y="27" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183e36">Reuna ratkaisee</text><path d="M25 112L130 112L59 49Z" fill="#c8e0e6" stroke="#183e36" stroke-width="3"/><path d="M204 115L224 40L240 112Z" fill="#edcf89" stroke="#183e36" stroke-width="3"/><text x="77" y="143" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">kolmio</text><text x="224" y="143" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">myös kolmio</text><g transform="rotate(35 75 216)"><rect x="37" y="178" width="76" height="76" fill="#c8e0e6" stroke="#183e36" stroke-width="3"/><path d="M37 192h14v-14" fill="none" stroke="#183e36" stroke-width="2"/></g><rect x="171" y="186" width="112" height="60" fill="#edcf89" stroke="#183e36" stroke-width="3"/><path d="M171 200h14v-14" fill="none" stroke="#183e36" stroke-width="2"/><text x="75" y="286" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">neliö</text><text x="226" y="286" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">suorakulmio</text><text x="160" y="314" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Molemmissa 4 suoraa kulmaa.</text><circle cx="55" cy="372" r="30" fill="#c8e0e6" stroke="#183e36" stroke-width="3"/><path d="M125 396L193 396L159 337L137 374" fill="none" stroke="#183e36" stroke-width="3"/><path d="M228 396L298 396Q311 367 262 337Z" fill="#edcf89" stroke="#183e36" stroke-width="3"/><text x="55" y="437" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">ympyrä</text><text x="159" y="437" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">aukko</text><text x="262" y="437" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#183e36">kaareva sivu</text><text x="211" y="466" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#183e36">Nämä eivät ole kolmioita.</text><text x="160" y="510" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Asento ei muuta ominaisuuksia.</text></svg>
