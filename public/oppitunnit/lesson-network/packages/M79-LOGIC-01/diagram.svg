<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" width="320" height="330" role="img"><title>x + 4 sopii ensimmäiseen pariin mutta ei seuraaviin</title><rect width="320" height="330" fill="#fffdf6"/><text x="55" y="38" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#183e36">Syöte</text><text x="153" y="38" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#183e36">Annettu</text><text x="259" y="38" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#183e36">x + 4</text><path d="M20 107 H300" stroke="#bdcaba" stroke-width="2"/><text x="55" y="92" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#183e36">1</text><text x="153" y="92" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#183e36">5</text><text x="259" y="92" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#183e36">5</text><path d="M20 162 H300" stroke="#bdcaba" stroke-width="2"/><text x="55" y="147" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#183e36">2</text><text x="153" y="147" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#183e36">8</text><text x="259" y="147" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#a03c2c">6</text><path d="M20 217 H300" stroke="#bdcaba" stroke-width="2"/><text x="55" y="202" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#183e36">4</text><text x="153" y="202" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#183e36">14</text><text x="259" y="202" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#a03c2c">8</text><text x="160" y="262" text-anchor="middle" font-size="23" font-family="sans-serif" fill="#183e36">2 + 4 = 6 ≠ 8</text><text x="160" y="300" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#183e36">Toinen pari kumoaa ehdotuksen.</text></svg>
