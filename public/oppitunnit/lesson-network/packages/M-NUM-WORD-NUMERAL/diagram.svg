<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img"><title>Sama luku sanana ja numerona</title><desc>Kuusi liittyy merkintään 6, yhdeksän merkintään 9. Kuuden suljettu lenkki on alhaalla, yhdeksän lenkki ylhäällä.</desc><rect width="320" height="320" rx="14" fill="#fffdf7"/><text x="85" y="55" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#183e36">kuusi</text><text x="160" y="55" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#183e36">↔</text><text x="240" y="70" text-anchor="middle" font-family="sans-serif" font-size="70" fill="#183e36">6</text><text x="85" y="164" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183e36">yhdeksän</text><text x="160" y="164" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#183e36">↔</text><text x="240" y="185" text-anchor="middle" font-family="sans-serif" font-size="70" fill="#183e36">9</text><text x="160" y="247" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#183e36">Sana ja merkintä ovat pari.</text><text x="160" y="285" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">6: lenkki alas. 9: lenkki ylös.</text></svg>
