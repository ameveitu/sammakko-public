<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="Leikkikaupan pallojen tarkistettu määrä on nolla"><title>Leikkikaupan pallojen tarkistettu määrä on nolla</title><rect width="600" height="280" fill="#fffdf6"/><text x="20" y="35" font-size="28" font-family="sans-serif" fill="#183e36">Tarkistettu leikkikaupan hylly</text><rect x="20" y="60" width="555" height="62" fill="#edf1e6" stroke="#49645c" stroke-width="2"/><text x="40" y="103" font-size="28" font-family="sans-serif" fill="#183e36">Kortit</text><text x="420" y="103" font-size="30" font-family="sans-serif" fill="#183e36">2</text><rect x="20" y="122" width="555" height="62" fill="#fff0c9" stroke="#49645c" stroke-width="2"/><text x="40" y="165" font-size="28" font-family="sans-serif" fill="#183e36">Pallot</text><text x="420" y="165" font-size="30" font-family="sans-serif" fill="#183e36">0</text><rect x="20" y="184" width="555" height="62" fill="#edf1e6" stroke="#49645c" stroke-width="2"/><text x="40" y="227" font-size="28" font-family="sans-serif" fill="#183e36">Kynät</text><text x="420" y="227" font-size="30" font-family="sans-serif" fill="#183e36">4</text><text x="20" y="274" font-size="24" font-family="sans-serif" fill="#183e36">0 = tarkistettu, ei yhtään</text></svg>
