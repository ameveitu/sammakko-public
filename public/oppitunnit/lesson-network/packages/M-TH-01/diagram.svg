<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img"><title>Vertaa yksi ominaisuus kerrallaan</title><desc>Kaksi yhtä suurta ympyrää: toinen sininen, toinen punainen. Muoto ja koko ovat samat. Väri on eri.</desc><rect width="320" height="320" rx="14" fill="#fffdf7"/><circle cx="85" cy="67" r="30" fill="#3576b8"/><circle cx="235" cy="67" r="30" fill="#b44564"/><text x="160" y="125" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#183e36">Muoto: sama</text><text x="160" y="163" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#183e36">Väri: eri</text><text x="160" y="201" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#183e36">Koko: sama</text><text x="160" y="251" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">Samaa ja erilaista</text><text x="160" y="285" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">voi olla yhtä aikaa.</text></svg>
