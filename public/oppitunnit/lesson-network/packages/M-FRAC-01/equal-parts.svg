<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 490" role="img" aria-labelledby="t d"><title id="t">Kokonainen ja yhtä suuret osat</title><desc id="d">Sama suikale ensin kokonaisena, sitten keskeltä ja sivusta jaettuna. Pyöreä leipä jaetaan neljään yhtä suureen palaan.</desc><g font-family="sans-serif" font-size="21" fill="#203e48"><text x="18" y="28">Kokonainen</text><rect x="20" y="42" width="280" height="48" fill="#f5d387" stroke="#203e48" stroke-width="2"/><text x="18" y="122">Yhtä suuret osat</text><rect x="20" y="136" width="280" height="48" fill="#f5d387" stroke="#203e48" stroke-width="2"/><path d="M160 136v48" stroke="#203e48" stroke-width="4"/><text x="18" y="220">Eri suuret osat</text><rect x="20" y="234" width="280" height="48" fill="#f5d387" stroke="#203e48" stroke-width="2"/><path d="M76 234v48" stroke="#203e48" stroke-width="4"/><text x="18" y="326">Uusi kokonainen:</text><text x="18" y="354">pyöreä leipä</text><circle cx="160" cy="422" r="58" fill="#f5d387" stroke="#203e48" stroke-width="2"/><path d="M102 422h116M160 364v116" stroke="#203e48" stroke-width="3"/></g></svg>