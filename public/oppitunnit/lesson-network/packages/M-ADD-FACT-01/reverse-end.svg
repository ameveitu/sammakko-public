<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 184" role="img" aria-label="Kahden muutoksen malli, vaihe 2, nyt 7 merkkiä."><g fill="#173e35" font-family="sans-serif"><text x="170" y="25" text-anchor="middle" font-size="22">Nyt 7</text><circle data-current="0" cx="24" cy="72" r="8" fill="#286e62" stroke="#173e35"/><circle data-current="1" cx="53" cy="72" r="8" fill="#286e62" stroke="#173e35"/><circle data-current="2" cx="82" cy="72" r="8" fill="#286e62" stroke="#173e35"/><circle data-current="3" cx="111" cy="72" r="8" fill="#286e62" stroke="#173e35"/><circle data-current="4" cx="140" cy="72" r="8" fill="#286e62" stroke="#173e35"/><circle data-current="5" cx="169" cy="72" r="8" fill="#286e62" stroke="#173e35"/><circle data-current="6" cx="198" cy="72" r="8" fill="#286e62" stroke="#173e35"/><text data-equation="first" x="170" y="127" text-anchor="middle" font-size="22">8 − 3 = 5</text><text data-equation="second" x="170" y="168" text-anchor="middle" font-size="22">5 + 2 = 7</text></g></svg>
