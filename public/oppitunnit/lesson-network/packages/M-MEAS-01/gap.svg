<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img" aria-label="Nauha, jossa jäi väli mittapaloihin. 3 mittapalaa. Palat ovat samanpituisia. Palan 1 alku on 0 mittapalan päässä alkuviivasta. Palan 2 alku on 1 mittapalan päässä alkuviivasta. Palan 3 alku on 3 mittapalan päässä alkuviivasta. Valitse pala sen painikkeesta, jos haluat siirtää sitä."><title>Samanmittaisten mittapalojen sijoittelu</title><rect width="360" height="210" rx="10" fill="#fffdf7"/><text x="18" y="25" font-size="20" fill="#183e36">Nauha</text><rect data-measured="true" x="24" y="47" width="168" height="30" fill="#a6c6d6" stroke="#183e36" stroke-width="2"/><path d="M24 38V170M192 38V170" stroke="#183e36" stroke-dasharray="4 3" stroke-width="2"/><g data-piece-index="0" data-start="0"><rect x="24" y="100" width="42" height="32" fill="#ebce7b" fill-opacity=".78" stroke="#655223" stroke-width="1.5"/><text x="45" y="122" text-anchor="middle" fill="#183e36" font-size="20">1</text></g><g data-piece-index="1" data-start="1"><rect x="66" y="100" width="42" height="32" fill="#ebce7b" fill-opacity=".78" stroke="#655223" stroke-width="1.5"/><text x="87" y="122" text-anchor="middle" fill="#183e36" font-size="20">2</text></g><g data-piece-index="2" data-start="3"><rect x="150" y="100" width="42" height="32" fill="#ebce7b" fill-opacity=".78" stroke="#655223" stroke-width="1.5"/><text x="171" y="122" text-anchor="middle" fill="#183e36" font-size="20">3</text></g><text x="24" y="195" fill="#183e36" font-size="17">Yksi mittapala on yksi yksikkö.</text></svg>
