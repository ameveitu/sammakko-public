<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310" role="img" aria-labelledby="title desc"><title id="title">Mitä liikkeestä voi kysyä?</title><desc id="desc">Alkuperäinen selittävä kaavio, ei valokuva tai oikea tutkimusaineisto.</desc><text x="160" y="28" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">Katso tapahtuma ajan kuluessa</text><rect x="12" y="48" width="296" height="65" rx="8" fill="#edf3ef" stroke="#183e36" stroke-width="2"/><text x="160" y="75" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">Jatkuuko paikan muuttuminen?</text><text x="160" y="101" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Vai jäikö kohde paikalleen?</text><rect x="12" y="130" width="296" height="65" rx="8" fill="#edf3ef" stroke="#183e36" stroke-width="2"/><text x="160" y="157" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">Vaihtuuko kulkusuunta?</text><text x="160" y="183" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Kohti merkkiä vai takaisin?</text><rect x="12" y="212" width="296" height="65" rx="8" fill="#edf3ef" stroke="#183e36" stroke-width="2"/><text x="160" y="239" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">Muuttuuko eteneminen?</text><text x="160" y="265" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Pidemmälle, vähemmän vai samoin?</text></svg>
