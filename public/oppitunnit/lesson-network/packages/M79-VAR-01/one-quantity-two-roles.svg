<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" role="img" aria-labelledby="title desc"><title id="title">Sama määrä suunnitelmassa ja tilauksessa</title><desc id="desc">Vapaasti valittu kaksi korttia jokaisessa kolmessa pussissa antaa kuusi korttia. Annettu kaksitoista korttia kolmessa yhtä suuressa pussissa tarkoittaa neljää korttia kussakin.</desc><rect width="420" height="480" rx="14" fill="#faf8f1"/><text x="210" y="30" font-family="sans-serif" font-size="22" fill="#183e36" text-anchor="middle">Vapaa suunnitelma: n = 2</text><rect x="30" y="52" width="100" height="96" rx="10" fill="#e3edf3" stroke="#45685e" stroke-width="2"/><circle cx="60" cy="88" r="9" fill="#2d607c"/><circle cx="98" cy="88" r="9" fill="#2d607c"/><text x="80" y="129" font-family="sans-serif" font-size="18" fill="#183e36" text-anchor="middle">n = 2</text><rect x="160" y="52" width="100" height="96" rx="10" fill="#e3edf3" stroke="#45685e" stroke-width="2"/><circle cx="190" cy="88" r="9" fill="#2d607c"/><circle cx="228" cy="88" r="9" fill="#2d607c"/><text x="210" y="129" font-family="sans-serif" font-size="18" fill="#183e36" text-anchor="middle">n = 2</text><rect x="290" y="52" width="100" height="96" rx="10" fill="#e3edf3" stroke="#45685e" stroke-width="2"/><circle cx="320" cy="88" r="9" fill="#2d607c"/><circle cx="358" cy="88" r="9" fill="#2d607c"/><text x="340" y="129" font-family="sans-serif" font-size="18" fill="#183e36" text-anchor="middle">n = 2</text><text x="210" y="180" font-family="sans-serif" font-size="23" fill="#183e36" text-anchor="middle">K = 2 + 2 + 2 = 6</text><text x="210" y="216" font-family="sans-serif" font-size="18" fill="#183e36" text-anchor="middle">Voit valita toisen n:n.</text><path d="M25 238H395" stroke="#9cb3a4" stroke-width="2"/><text x="210" y="270" font-family="sans-serif" font-size="22" fill="#183e36" text-anchor="middle">Annettu tilaus: yhteensä 12</text><rect x="30" y="292" width="100" height="100" rx="10" fill="#f5e6b6" stroke="#45685e" stroke-width="2"/><circle cx="60" cy="316" r="8" fill="#896631"/><circle cx="98" cy="316" r="8" fill="#896631"/><circle cx="60" cy="341" r="8" fill="#896631"/><circle cx="98" cy="341" r="8" fill="#896631"/><text x="80" y="378" font-family="sans-serif" font-size="18" fill="#183e36" text-anchor="middle">n = 4</text><rect x="160" y="292" width="100" height="100" rx="10" fill="#f5e6b6" stroke="#45685e" stroke-width="2"/><circle cx="190" cy="316" r="8" fill="#896631"/><circle cx="228" cy="316" r="8" fill="#896631"/><circle cx="190" cy="341" r="8" fill="#896631"/><circle cx="228" cy="341" r="8" fill="#896631"/><text x="210" y="378" font-family="sans-serif" font-size="18" fill="#183e36" text-anchor="middle">n = 4</text><rect x="290" y="292" width="100" height="100" rx="10" fill="#f5e6b6" stroke="#45685e" stroke-width="2"/><circle cx="320" cy="316" r="8" fill="#896631"/><circle cx="358" cy="316" r="8" fill="#896631"/><circle cx="320" cy="341" r="8" fill="#896631"/><circle cx="358" cy="341" r="8" fill="#896631"/><text x="340" y="378" font-family="sans-serif" font-size="18" fill="#183e36" text-anchor="middle">n = 4</text><text x="210" y="425" font-family="sans-serif" font-size="23" fill="#183e36" text-anchor="middle">3n = 12 → n = 4</text><text x="210" y="459" font-family="sans-serif" font-size="18" fill="#183e36" text-anchor="middle">Sama sisältö jokaisessa pussissa.</text></svg>