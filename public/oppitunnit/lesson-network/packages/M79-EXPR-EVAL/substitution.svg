<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img"><title>Annettu nelonen sijoitetaan kirjaimen paikalle</title><rect width="420" height="420" rx="12" fill="#faf8f1"/><text x="210" y="30" font-family="sans-serif" text-anchor="middle" font-size="22" fill="#183e36">x = 4 merkkiä pussissa</text><rect x="28" y="55" width="100" height="104" rx="12" fill="#e1ecf0" stroke="#52766b" stroke-width="2"/><circle cx="58" cy="83" r="8" fill="#34677f"/><circle cx="96" cy="83" r="8" fill="#34677f"/><circle cx="58" cy="113" r="8" fill="#34677f"/><circle cx="96" cy="113" r="8" fill="#34677f"/><text x="78" y="145" font-family="sans-serif" text-anchor="middle" font-size="18" fill="#183e36">x = 4</text><rect x="148" y="55" width="100" height="104" rx="12" fill="#e1ecf0" stroke="#52766b" stroke-width="2"/><circle cx="178" cy="83" r="8" fill="#34677f"/><circle cx="216" cy="83" r="8" fill="#34677f"/><circle cx="178" cy="113" r="8" fill="#34677f"/><circle cx="216" cy="113" r="8" fill="#34677f"/><text x="198" y="145" font-family="sans-serif" text-anchor="middle" font-size="18" fill="#183e36">x = 4</text><rect x="268" y="55" width="100" height="104" rx="12" fill="#e1ecf0" stroke="#52766b" stroke-width="2"/><circle cx="298" cy="83" r="8" fill="#34677f"/><circle cx="336" cy="83" r="8" fill="#34677f"/><circle cx="298" cy="113" r="8" fill="#34677f"/><circle cx="336" cy="113" r="8" fill="#34677f"/><text x="318" y="145" font-family="sans-serif" text-anchor="middle" font-size="18" fill="#183e36">x = 4</text><text x="210" y="192" font-family="sans-serif" text-anchor="middle" font-size="20" fill="#183e36">Kolme neljän ryhmää: 3 · 4 = 12</text><circle cx="192" cy="223" r="8" fill="#b78037"/><circle cx="228" cy="223" r="8" fill="#b78037"/><text x="210" y="257" font-family="sans-serif" text-anchor="middle" font-size="20" fill="#183e36">ja 2 irtomerkkiä</text><path d="M210 270v22m-7-7 7 7 7-7" fill="none" stroke="#52766b" stroke-width="3"/><text x="210" y="326" font-family="sans-serif" text-anchor="middle" font-size="24" fill="#183e36">3x + 2 → 3 · 4 + 2</text><text x="210" y="366" font-family="sans-serif" text-anchor="middle" font-size="26" fill="#183e36">12 + 2 = 14</text><text x="210" y="401" font-family="sans-serif" text-anchor="middle" font-size="17" fill="#183e36">x on luku, ei esineen nimi.</text></svg>