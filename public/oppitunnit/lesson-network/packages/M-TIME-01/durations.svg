<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 235" role="img" aria-labelledby="title desc"><title id="title">Kaksi esitystä, vertaa kestoa</title><desc id="desc">Ensin yhdessä aloittaneet A ja B: A:n jälkipituus60 ja B:n36, B paloi kauemmin. Toisessa A:n36 ja B:n60, A paloi kauemmin eri aloituksista huolimatta. Kuvan lähtöpituus ja lyhenemisvauhti ovat samat.</desc><rect width="660" height="235" fill="#faf8f1"/><g fill="none" stroke="#49645c" stroke-dasharray="4 4"><path d="M70 55H118M210 55H258M405 55H453M545 55H593"/></g><g stroke="#183e36" stroke-width="2"><rect x="70" y="91" width="48" height="60" fill="#b96044"/><rect x="210" y="115" width="48" height="36" fill="#4f7aa5"/><rect x="405" y="115" width="48" height="36" fill="#b96044"/><rect x="545" y="91" width="48" height="60" fill="#4f7aa5"/></g><g fill="#183e36" font-family="sans-serif" font-size="20" text-anchor="middle"><text x="165" y="28">Yhdessä alkuun</text><text x="500" y="28">B aloittaa myöhemmin</text><text x="94" y="180">A</text><text x="234" y="180">B</text><text x="429" y="180">A</text><text x="569" y="180">B</text><text x="165" y="215">B paloi kauemmin</text><text x="500" y="215">A paloi kauemmin</text></g></svg>
