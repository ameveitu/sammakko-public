<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 390" role="img" aria-labelledby="t d"><title id="t">Esineiden kuvat ja pohjien kuviot</title><desc id="d">Kuution piirroksen vieressä neliö. Tölkin piirroksen vieressä ympyrä. Kaikki ovat kuvia tasaisella ruudulla.</desc><g stroke="#203e48" stroke-width="3" stroke-linejoin="round"><path d="M30 54l24-20h64l-24 20z" fill="#c4dfe9"/><path d="M30 54h64v64H30z" fill="#83b6ca"/><path d="M94 54l24-20v64l-24 20z" fill="#4e8299"/><rect x="209" y="53" width="65" height="65" fill="#fffbef"/><path d="M40 211v66a35 11 0 0 0 70 0V211" fill="#83b6ca"/><ellipse cx="75" cy="211" rx="35" ry="11" fill="#c4dfe9"/><circle cx="241" cy="246" r="34" fill="#fffbef"/></g><g font-family="sans-serif" font-size="21" fill="#203e48" text-anchor="middle"><text x="75" y="154">kuution kuva</text><text x="241" y="154">neliö</text><text x="75" y="314">tölkin kuva</text><text x="241" y="314">ympyrä</text><text x="160" y="360">Kuva esittää esinettä.</text><text x="160" y="386">Se ei ole oikea esine.</text></g></svg>