<svg xmlns="http://www.w3.org/2000/svg" width="360" height="242" viewBox="0 0 360 242" role="img" aria-label="Osamäärä on 6 annosta. Annos voi jäädä osittaiseksi."><rect width="360" height="242" fill="#fffdf5"/><text x="180" y="28" font-size="21" font-family="sans-serif" text-anchor="middle" fill="#173e35">Osamäärä ja merkitys</text><text x="20" y="58" font-size="18" font-family="sans-serif" text-anchor="start" fill="#173e35">Yhteensä</text><text x="340" y="58" font-size="20" font-family="sans-serif" text-anchor="end" fill="#173e35">150 cl</text><rect x="24" y="69" width="296" height="26" fill="none" stroke="#9bb0a8"/><rect data-quantity="dividend" x="24" y="69" width="296" height="26" fill="#57998c"/><line x1="73.33333333333333" y1="69" x2="73.33333333333333" y2="95" stroke="#fffdf5" stroke-width="2"/><line x1="122.66666666666666" y1="69" x2="122.66666666666666" y2="95" stroke="#fffdf5" stroke-width="2"/><line x1="172" y1="69" x2="172" y2="95" stroke="#fffdf5" stroke-width="2"/><line x1="221.33333333333331" y1="69" x2="221.33333333333331" y2="95" stroke="#fffdf5" stroke-width="2"/><line x1="270.6666666666667" y1="69" x2="270.6666666666667" y2="95" stroke="#fffdf5" stroke-width="2"/><text x="20" y="128" font-size="18" font-family="sans-serif" text-anchor="start" fill="#173e35">Yksi annos</text><text x="340" y="128" font-size="20" font-family="sans-serif" text-anchor="end" fill="#173e35">25 cl</text><rect x="24" y="139" width="296" height="26" fill="none" stroke="#9bb0a8"/><rect data-quantity="divisor" x="24" y="139" width="49.33333333333333" height="26" fill="#dca45f"/><text x="180" y="198" font-size="22" font-family="sans-serif" text-anchor="middle" fill="#173e35">150 : 25 = 6</text><text x="180" y="229" font-size="18" font-family="sans-serif" text-anchor="middle" fill="#173e35">Tarkista: osamäärä × jakaja.</text></svg>