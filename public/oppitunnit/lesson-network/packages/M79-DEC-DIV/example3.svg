<svg xmlns="http://www.w3.org/2000/svg" width="360" height="242" viewBox="0 0 360 242" role="img" aria-label="Osamäärä on 1/3 annosta. Annos voi jäädä osittaiseksi."><rect width="360" height="242" fill="#fffdf5"/><text x="180" y="28" font-size="21" font-family="sans-serif" text-anchor="middle" fill="#173e35">Osamäärä ja merkitys</text><text x="20" y="58" font-size="18" font-family="sans-serif" text-anchor="start" fill="#173e35">Yhteensä</text><text x="340" y="58" font-size="20" font-family="sans-serif" text-anchor="end" fill="#173e35">2 dl</text><rect x="24" y="69" width="296" height="26" fill="none" stroke="#9bb0a8"/><rect data-quantity="dividend" x="24" y="69" width="98.66666666666666" height="26" fill="#57998c"/><text x="20" y="128" font-size="18" font-family="sans-serif" text-anchor="start" fill="#173e35">Yksi annos</text><text x="340" y="128" font-size="20" font-family="sans-serif" text-anchor="end" fill="#173e35">6 dl</text><rect x="24" y="139" width="296" height="26" fill="none" stroke="#9bb0a8"/><rect data-quantity="divisor" x="24" y="139" width="296" height="26" fill="#dca45f"/><text x="180" y="198" font-size="22" font-family="sans-serif" text-anchor="middle" fill="#173e35">2 : 6 = 1/3</text><text x="180" y="229" font-size="18" font-family="sans-serif" text-anchor="middle" fill="#173e35">Tarkista: osamäärä × jakaja.</text></svg>