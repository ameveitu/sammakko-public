<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-labelledby="t d"><title id="t">Hylly samasta katselupaikasta</title><desc id="d">Ylhäällä kiekko on laatikon oikealla puolella, alhaalla kahden kirjan välissä. Suunnat ovat ruutua katsovan suunnat.</desc><g font-family="sans-serif" font-size="21" fill="#203e48"><text x="10" y="30">← vasen</text><text x="220" y="30">oikea →</text><path d="M10 148h300M10 282h300" stroke="#6d5436" stroke-width="4"/><rect x="46" y="80" width="62" height="52" fill="#e6be83" stroke="#203e48" stroke-width="3"/><text x="77" y="68" text-anchor="middle">laatikko</text><circle cx="235" cy="106" r="25" fill="#a44815" stroke="#203e48" stroke-width="2"/><text x="235" y="68" text-anchor="middle">kiekko</text><rect x="15" y="237" width="65" height="32" fill="#d5e2f1" stroke="#203e48" stroke-width="3"/><rect x="240" y="237" width="65" height="32" fill="#d5e2f1" stroke="#203e48" stroke-width="3"/><path d="M22 245h49m-49 8h49m-49 8h49M247 245h49m-49 8h49m-49 8h49" stroke="#203e48" stroke-width="2"/><circle cx="160" cy="251" r="25" fill="#a44815" stroke="#203e48" stroke-width="2"/><text x="160" y="216" text-anchor="middle">kirjojen välissä</text><text x="160" y="328" text-anchor="middle">Hylly edestä katsottuna</text></g></svg>