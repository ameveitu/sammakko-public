<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Korissa oli 6 omenaa. Niistä otettiin 2 pois. Kirjoita määrien yhteyttä kuvaava laskulause."><title>Tilanne, osat ja laskulause</title><g fill="#183e36" font-family="sans-serif"><circle data-original="0" cx="45" cy="72" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-original="1" cx="83" cy="72" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-original="2" cx="121" cy="72" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-original="3" cx="159" cy="72" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-original="4" cx="197" cy="72" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-original="5" cx="235" cy="72" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><path data-removed="0" d="M224 61 l22 22 m0 -22 l-22 22" stroke="#9b4538" stroke-width="3"/><path data-removed="1" d="M186 61 l22 22 m0 -22 l-22 22" stroke="#9b4538" stroke-width="3"/><text x="180" y="25" text-anchor="middle" font-size="18">Aluksi 6, pois 2</text><text x="180" y="177" text-anchor="middle" font-size="24">6 − 2 = 4</text></g></svg>
