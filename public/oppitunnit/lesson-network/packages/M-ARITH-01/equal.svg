<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Yhdessä joukossa on 3 ja 1 merkkiä, toisessa 2 ja 2. Kirjoita yhtäsuuruus. Voit ryhmitellä osat tai vaihtaa puolia."><title>Tilanne, osat ja laskulause</title><g fill="#183e36" font-family="sans-serif"><circle data-left="0" cx="38" cy="78" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-right="0" cx="222" cy="78" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-left="1" cx="66" cy="78" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-right="1" cx="250" cy="78" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-left="2" cx="94" cy="78" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-right="2" cx="278" cy="78" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.5"/><circle data-left="3" cx="122" cy="78" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.5"/><circle data-right="3" cx="306" cy="78" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.5"/><text x="180" y="25" text-anchor="middle" font-size="18">3 ja 1. Toisessa 2 ja 2.</text><text x="180" y="177" text-anchor="middle" font-size="24">3 + 1 = 2 + 2</text></g></svg>
