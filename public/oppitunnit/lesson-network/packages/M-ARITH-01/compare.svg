<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Yhdessä rasiassa on 3 ja toisessa 5 nappia. Kuinka monta nappia toisessa on enemmän? Kirjoita määrien yhteys. Nappeja ei poisteta."><title>Tilanne, osat ja laskulause</title><g fill="#183e36" font-family="sans-serif"><circle data-upper="0" cx="50" cy="58" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-upper="1" cx="92" cy="58" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-upper="2" cx="134" cy="58" r="8" fill="#328372" stroke="#234b40" stroke-width="1.5"/><circle data-lower="0" cx="50" cy="116" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.5"/><circle data-lower="1" cx="92" cy="116" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.5"/><circle data-lower="2" cx="134" cy="116" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.5"/><circle data-lower="3" cx="176" cy="116" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.5"/><circle data-lower="4" cx="218" cy="116" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.5"/><path data-pair="0" d="M50 68 V106" stroke="#668c7b" stroke-width="2"/><path data-pair="1" d="M92 68 V106" stroke="#668c7b" stroke-width="2"/><path data-pair="2" d="M134 68 V106" stroke="#668c7b" stroke-width="2"/><text x="180" y="24" text-anchor="middle" font-size="18">Kolme ja viisi. Tee pareja.</text><text x="180" y="177" text-anchor="middle" font-size="24">5 − 3 = 2</text></g></svg>
