<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-labelledby="title desc"><title id="title">Saman ajan matkojen vertailu</title><desc id="desc">Molemmat vaunut lähtevät nollasta. A kulkee 8 metriä, B 12 metriä, aikaa on kummallakin 4 sekuntia.</desc><rect width="640" height="210" fill="#faf8f1"/><g font-family="sans-serif" fill="#183e36"><text x="25" y="35" font-size="22">Aika molemmilla: 4 s</text><text x="25" y="85" font-size="20">A</text><rect x="90" y="60" width="320" height="32" fill="#245f4c"/><text x="425" y="83" font-size="20">8 m</text><text x="25" y="140" font-size="20">B</text><rect x="90" y="115" width="480" height="32" fill="#97562f"/><text x="575" y="140" font-size="18">12 m</text><path d="M90 45V170M90 170H570" stroke="#183e36" fill="none"/><g font-size="18"><text x="85" y="195">0</text><text x="245" y="195">4</text><text x="405" y="195">8</text><text x="555" y="195">12 m</text></g></g></svg>
