<svg xmlns="http://www.w3.org/2000/svg" width="360" height="224" viewBox="0 0 360 224" role="img" aria-label="Laskun vaihe 4 neljästä, ei kello tai liikesimulaatio. 18 km/h = 5 m/s Sama nopeus eri lukuarvolla. 5 m/s SI-yksikössä"><rect width="360" height="224" fill="#fffdf5"/><text x="180" y="30" font-size="21" font-family="sans-serif" fill="#173e35" text-anchor="middle">Tulos ja merkitys</text><text x="18" y="64" font-size="18" font-family="sans-serif" fill="#173e35" text-anchor="start">18 km/h = 5 m/s</text><text x="18" y="89" font-size="18" font-family="sans-serif" fill="#173e35" text-anchor="start">Sama nopeus eri lukuarvolla.</text><text x="18" y="114" font-size="18" font-family="sans-serif" fill="#173e35" text-anchor="start">5 m/s SI-yksikössä</text></svg>