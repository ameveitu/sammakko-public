<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-label="Yksi litra kolmeen yhtä suureen osaan. Kukin osa on täsmälleen yksi kolmasosa litraa."><rect width="360" height="220" fill="#fffdf5"/><text x="18" y="26" font-size="18" font-family="sans-serif" text-anchor="start" fill="#173e35">1 litra jaetaan 3 yhtä suureen osaan.</text><rect x="30" y="55" width="300" height="16" fill="#438b98" stroke="#173e35"/><line x1="130" y1="48" x2="130" y2="80" stroke="#fffdf5" stroke-width="3"/><line x1="230" y1="48" x2="230" y2="80" stroke="#fffdf5" stroke-width="3"/><text x="80" y="112" font-size="18" font-family="sans-serif" text-anchor="middle" fill="#173e35">1/3 l</text><text x="180" y="112" font-size="18" font-family="sans-serif" text-anchor="middle" fill="#173e35">1/3 l</text><text x="280" y="112" font-size="18" font-family="sans-serif" text-anchor="middle" fill="#173e35">1/3 l</text><text x="180" y="155" font-size="20" font-family="sans-serif" text-anchor="middle" fill="#173e35">3 × 1/3 l = 1 l</text><text x="180" y="190" font-size="17" font-family="sans-serif" text-anchor="middle" fill="#173e35">0,33 l ei ole täsmälleen 1/3 l.</text></svg>
