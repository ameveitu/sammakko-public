<svg xmlns="http://www.w3.org/2000/svg" width="320" height="405" viewBox="0 0 320 405" role="img"><title>Annettu sääntö muuttaa ryhmiä</title><desc>Yläkuvassa raidalliset laput ryhmitellään yhteen. Alakuvassa samat laput ryhmitellään pyöreyden mukaan. Raidaton pyöreä lappu vaihtaa ryhmää, kuten raidallinen kulmikas lappu.</desc><rect width="320" height="405" rx="14" fill="#fffdf7"/><text x="160" y="27" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">Ohje 1: katso raitoja</text><rect x="8" y="45" width="146" height="118" rx="10" fill="none" stroke="#245f4c" stroke-width="2"/><text x="81" y="72" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Raidalliset</text><rect x="166" y="45" width="146" height="118" rx="10" fill="none" stroke="#245f4c" stroke-width="2"/><text x="239" y="72" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Muut</text><circle cx="48" cy="118" r="16" fill="#dfeae2" stroke="#245f4c" stroke-width="2"/><path d="M38 111 H58" stroke="#245f4c" stroke-width="3"/><path d="M38 118 H58" stroke="#245f4c" stroke-width="3"/><path d="M38 125 H58" stroke="#245f4c" stroke-width="3"/><rect x="95" y="102" width="32" height="32" fill="#dfeae2" stroke="#245f4c" stroke-width="2"/><path d="M101 111 H121" stroke="#245f4c" stroke-width="3"/><path d="M101 118 H121" stroke="#245f4c" stroke-width="3"/><path d="M101 125 H121" stroke="#245f4c" stroke-width="3"/><circle cx="206" cy="118" r="16" fill="#dfeae2" stroke="#245f4c" stroke-width="2"/><rect x="253" y="102" width="32" height="32" fill="#dfeae2" stroke="#245f4c" stroke-width="2"/><text x="160" y="210" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">Samat laput, uusi ohje</text><text x="160" y="244" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183e36">Ohje 2: katso muotoa</text><rect x="8" y="265" width="146" height="118" rx="10" fill="none" stroke="#245f4c" stroke-width="2"/><text x="81" y