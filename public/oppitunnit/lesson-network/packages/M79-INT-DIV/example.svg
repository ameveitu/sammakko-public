<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img" aria-label="Jakolaskun merkitys tarkistetaan tulon avulla; ei negatiivisia esinemääriä."><g font-family="sans-serif" fill="#163e38"><text x="160" y="25" font-size="23" text-anchor="middle">(−20) : (−4) = 5</text><text x="160" y="62" font-size="25" text-anchor="middle">(−4) · q = −20</text><text x="160" y="102" font-size="23" text-anchor="middle">(−4) · (5) = −20</text><text x="160" y="136" font-size="23" text-anchor="middle">(−4) · (−5) = 20</text><text x="160" y="178" font-size="19" text-anchor="middle">Jakaja palauttaa jaettavan.</text></g></svg>
