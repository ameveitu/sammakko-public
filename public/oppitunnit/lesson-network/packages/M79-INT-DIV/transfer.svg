<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img" aria-label="Jakolaskun merkitys tarkistetaan tulon avulla; ei negatiivisia esinemääriä."><g font-family="sans-serif" fill="#163e38"><text x="160" y="25" font-size="23" text-anchor="middle">12 : (−3) = −4</text><text x="160" y="62" font-size="25" text-anchor="middle">(−3) · q = 12</text><text x="160" y="102" font-size="23" text-anchor="middle">(−3) · (−4) = 12</text><text x="160" y="136" font-size="23" text-anchor="middle">(−3) · (4) = −12</text><text x="160" y="178" font-size="19" text-anchor="middle">Jakaja palauttaa jaettavan.</text></g></svg>
