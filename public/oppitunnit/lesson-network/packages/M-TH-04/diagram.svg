<svg xmlns="http://www.w3.org/2000/svg" width="320" height="405" viewBox="0 0 320 405" role="img"><title>Toistuva osa ja kasvava kuvio</title><desc>Ylhäällä kulmikas, pyöreä, pyöreä toistuu kahdesti kehystettynä. Alhaalla kuviot kasvavat kahdesta neljään ja kuuteen pisteeseen: vanhat säilyvät, kaksi uutta lisätään.</desc><rect width="320" height="405" rx="14" fill="#fffdf7"/><text x="160" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#183e36">Toistuu: kulmikas, pyöreä, pyöreä</text><rect x="16" y="45" width="138" height="64" rx="10" fill="none" stroke="#315f53" stroke-width="2"/><polygon points="41,65 53,89 29,89" fill="#a34d13"/><circle cx="84" cy="77" r="12" fill="#315f53"/><circle cx="127" cy="77" r="12" fill="#315f53"/><rect x="167" y="45" width="138" height="64" rx="10" fill="none" stroke="#315f53" stroke-width="2"/><polygon points="192,65 204,89 180,89" fill="#a34d13"/><circle cx="235" cy="77" r="12" fill="#315f53"/><circle cx="278" cy="77" r="12" fill="#315f53"/><text x="160" y="137" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">Sama osa alkaa uudelleen.</text><text x="160" y="188" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183e36">Kasvaa: vanhat ja kaksi uutta</text><circle cx="40" cy="310" r="9" fill="#315f53"/><circle cx="64" cy="310" r="9" fill="#315f53"/><text x="52" y="343" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183e36">2</text><circle cx="148" cy="310" r="9" fill="#315f53"/><circle cx="172" cy="310" r="9" fill="#315f53"/><circle cx="148" cy="284" r="9" fill="#a34d13"/><circle cx="172" cy="284" r="9" fill="#a34d13"/><text x="160" y="343" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183e36">4</text><circle cx="256" cy="310" r="9" fill="#315f53"/><circle cx="280" cy="310" r="9" fill="#315f53"/><circle cx="256" cy="284" r="9" fill="#315f53"/><circle cx="280" cy="284" r="9" fill="#315f53"/><circle cx="256" cy="258" r="9" fill="#a34d13"/><circle cx="280" cy="258" r="9" fill="#a34d13"/><text x="268" y="343" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183e36">6</text><text x="160" y="385" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#183e36">Toisto ja kasvu ovat eri sääntöjä.</text></svg>
