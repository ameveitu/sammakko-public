<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" role="img" aria-label="7 jaettuna osiin 2 ja 5. Laskun 38 + 7 kaksi askelta."><title>Osat säilyttävät määrän, kaksi askelta samalla lukusuoralla</title><g fill="#183e36" font-family="sans-serif"><text x="180" y="25" text-anchor="middle" font-size="24">38 + 7</text><circle data-part="first" cx="45" cy="54" r="8" fill="#328372" stroke="#234b40" stroke-width="1.3"/><circle data-part="first" cx="74" cy="54" r="8" fill="#328372" stroke="#234b40" stroke-width="1.3"/><circle data-part="rest" cx="103" cy="54" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.3"/><circle data-part="rest" cx="132" cy="54" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.3"/><circle data-part="rest" cx="161" cy="54" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.3"/><circle data-part="rest" cx="190" cy="54" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.3"/><circle data-part="rest" cx="219" cy="54" r="8" fill="#d7aa5f" stroke="#234b40" stroke-width="1.3"/><text x="180" y="145" text-anchor="middle" font-size="23">7 = 2 + 5</text><text data-step="1" x="180" y="177" text-anchor="middle" font-size="22">38 + 2 = 40</text><text data-step="2" x="180" y="208" text-anchor="middle" font-size="22">40 + 5 = 45</text><path d="M20 265 H340" stroke="#355d50" stroke-width="2"/><text x="30" y="290" text-anchor="middle" font-size="17">38</text><text x="330" y="290" text-anchor="middle" font-size="17">45</text><path data-hop="first" d="M30 259 Q72.85714285714286 221 115.71428571428571 259" fill="none" stroke="#328372" stroke-width="3"/><path data-hop="rest" d="M115.71428571428571 259 Q222.85714285714286 221 330 259" fill="none" stroke="#9c7229" stroke-width="3"/><circle data-point="start" cx="30" cy="265" r="5" fill="#244e42"/><circle data-point="mid" cx="115.71428571428571" cy="265" r="5" fill="#244e42"/><circle data-point="end" cx="330" cy="265" r="5" fill="#244e42"/></g></svg>
