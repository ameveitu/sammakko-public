<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" role="img"><title>Lukusanojen oma järjestys</title><desc>Sanat yksi, kaksi, kolme, neljä, viisi ovat peräkkäin ylhäältä alas. Nuoli tarkoittaa seuraavaa sanaa.</desc><rect width="320" height="330" rx="16" fill="#fffdf7"/><rect x="82" y="22" width="156" height="38" rx="8" fill="#e0eee5" stroke="#245f4c"/><text x="160" y="47" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">yksi</text><text x="160" y="76" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">↓</text><rect x="82" y="82" width="156" height="38" rx="8" fill="#e0eee5" stroke="#245f4c"/><text x="160" y="107" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">kaksi</text><text x="160" y="136" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">↓</text><rect x="82" y="142" width="156" height="38" rx="8" fill="#e0eee5" stroke="#245f4c"/><text x="160" y="167" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">kolme</text><text x="160" y="196" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">↓</text><rect x="82" y="202" width="156" height="38" rx="8" fill="#e0eee5" stroke="#245f4c"/><text x="160" y="227" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">neljä</text><text x="160" y="256" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">↓</text><rect x="82" y="262" width="156" height="38" rx="8" fill="#e0eee5" stroke="#245f4c"/><text x="160" y="287" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#183e36">viisi</text></svg>
