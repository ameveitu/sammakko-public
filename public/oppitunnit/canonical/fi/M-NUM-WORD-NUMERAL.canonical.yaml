misconceptions:
  - id: M-NUM-WORD-NUMERAL-OBS-PARI
    description: Vahvistettu sana–numeromerkintä-pari ei vastaa samaa lukua.
      Havainto voi sopia esimerkiksi paikan tai merkin ulkoasun seuraamiseen,
      mutta syytä tai oppijan ominaisuutta ei päätellä.
    evidence_patterns:
      - kind: committed_relation_error
        when: Oppija vahvistaa vaihtoehdon, joka ei vastaa vihjeen arvoa. Keskeneräistä
          tai vahvistamatonta vastausta ei nimetä tällä havainnolla.
    feedback_strategy:
      conceptual_prompt: Nämä laput eivät vielä tarkoita samaa lukua. Katsotaan tämän
        luvun sana ja numeromerkintä yhdessä. Sen jälkeen saat kokeilla itse
        uudestaan.
      representation: Näytä pyydettäessä nykyiseen faktaan sidottu tyypitetty
        mallipari. Se on tukea; väärä vastaus tai tarjottu malli ei muutu
        itsenäiseksi näytöksi.
    repair_targets:
      - M-NUM-WORD-NUMERAL
    status: hypothesis
differentiation:
  support_variants:
    step_chunking: Yksi vihje ja yksi parivalinta kerrallaan. Aluksi koko mallikansi
      näyttää samat faktat molempiin suuntiin.
    hint_availability: Avun voi pyytää ennen virhettä. Nykyiseen faktaan sidottu
      valmis tukipari on apua ja pysyy sellaisena lokissa.
    text_density: Lyhyt suomenkielinen toimintaohje, suuret kortit; ei nimeämistä,
      kirjoituslomaketta tai kuulokuittausta.
    representation_boundary: Tekstisanan tunnistus on esitetyn reitin näyttö.
      Valinnainen sanan nimiluku ei osoita spontaania puhetta tai kuulemista.
    reduced_motion: Parin voi näyttää paikallaan; liike ja aikaraja eivät ole tavoite.
    optional_audio: Ääni on valinnainen ja aluksi pois. Tekstireitti toimii ilman
      puhepalvelua tai kuulemisen kuittausta. Sanan nimiluku ei ole oppijan
      spontaania puhetta eikä kuulemisen havainto.
  challenge_variants:
    learner_prompt: "Loikka sanoo: vaihdan aina vain eri lapun kuin alussa. Aava
      näyttää kolme vaihtoehtoa, joista kaksi on väärin. Miksi eri lappu ei
      yksin riitä? Näytä lopuksi oikea pari ja tarkista se myös toiseen
      suuntaan."
    reduced_scaffolding: Ei annettua malliparia. Sama 1–10-alue säilyy; vaikeus
      tulee yhteyden tarkistamisesta eikä suuremmista luvuista.
    assessment_limit: Pohdintaa ei pisteytetä; korjausnäyttö syntyy vain tuetun
      predikaatin mukaisesta omasta valinnasta.
    transfer_novelty: Matchingista siirrytään todellisen eri arvoisen parin
      korjaamiseen. Korttien nimi tai järjestys ei korvaa uutta operaatiota.
