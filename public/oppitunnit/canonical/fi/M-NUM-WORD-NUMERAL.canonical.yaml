  diagnostic:
    localized_child_repairs: {}
    minimum_templates: 2
    fast_path_confirmation_tags:
      - association_resolved
    execution_policy: Kaksi alkukartoitusta auttaa valitsemaan tuen. Fast path on
      pois käytöstä, eikä diagnoosi korvaa koko prosessin itsenäistä
      tapauskattavuutta.
    pass_rule: Molemmat vastaavuuspäätökset kirjataan todellisina havaintoina. Väärä
      pari ei paikanna puutetta lapsi-KC:hen.
  independent:
    minimum_successes: 3
    template_diversity: 2
    max_supported_attempts_counted: 0
    required_tags:
      - association_resolved
  transfer:
    required: true
    minimum_successes: 2
    novel_context_required: true
  delayed:
    required: true
    minimum_successes: 4
    minimum_delay_hours: 24
    reuse_templates: []
    required_tags:
      - association_resolved
    required_contexts: []
    earliest_delay_policy: Vähintään 24 tuntia koko hankintanäytön täyttymisestä;
      myöhemmässä istunnossa tai toisen osaamiskohteen jälkeen neljä uutta
      tuetonta havaintoa. Ensimmäinen ja viimeinen arvo molemmissa suunnissa
      ovat rajattu näyte, eivät koko faktajoukon säilymisnäyttö. Ajastus ja
      onnistumisrajat ovat projektipäätöksiä.
  supported_evidence:
    counts_as_mastery: false
  misconception_clearance:
    - misconception_id: M-NUM-WORD-NUMERAL-OBS-PARI
      evidence_tags:
        - association_resolved
      rule: Myöhempi tueton oikea relaatiopäätös poistaa tämän tehtäväkohtaisen
        aktiivisen havaintomerkinnän nykyisessä politiikassa. Se ei vahvista
        aiemman virheen syytä tai korvaa koko prosessin erikseen vaadittuja
        tapauksia.
