schema_version: 0.1.0
kc_id: M-NUM-WORD-NUMERAL
catalog_version: STEM_KC_Catalogs_v0.2
metadata:
  title: Lukusanan yhdistäminen sitä vastaavaan numeromerkintään
  subject: mathematics
  grade_band: 1-2
  mastery_role: process
  node_kind: representation
  concept_path:
    - Matematiikka
    - Luvut ja laskutoimitukset
    - Lukumäärän representaatiot
  source_basis: pedagogically_derived
  curriculum_refs:
    - OPH-POPS2014-MATH-VL1-2-S2
  prerequisite_snapshot:
    hard: []
    strong:
      - M-NUM-STABLE-ORDER
    helpful: []
teaching_model:
  learning_goal: Oppilas yhdistää lukusanat yksi–kymmenen numeromerkintöihin 1–10
    ja merkinnät samoihin sanoihin. Rajattu process-näyttö vaatii oman tuettoman
    päätöksen jokaisessa 20 suunta/arvo-tapauksessa, ei vain kolmea onnistunutta
    valintaa.
  learner_facing_goal: Löydän lukusanalle numerolapun ja numerolapulle sanan.
  core_idea: Sana neljä ja merkintä 4 ovat saman luvun eri esityksiä. Kortin
    paikka tai sanan pituus ei muuta yhteyttä. Toiseen suuntaan katsominen on
    oma tehtävä, vaikka faktapari on sama.
  success_evidence:
    - "Tekee oman vahvistetun parivalinnan jokaiselle arvolle 1–10 sanasta
      merkintään sekä merkinnästä sanaan: yhteensä 20 erillistä vaadittua
      tapausta."
    - Vähintään kolme tuetonta onnistumista ja kaksi itsenäistä pohjaa säilyvät
      vähimmäisehtoina koko tapauskattavuuden lisäksi.
    - Korjaa aidosti eri arvoisen parin myös ensimmäisestä opetetusta faktasta
      yksi/1 molemmissa suunnissa; pelkkä väärän parin hylkääminen ei riitä.
    - Myöhemmin vähintään 24 tunnin jälkeen yhdistää arvot yksi/1 ja kymmenen/10
      molemmissa suunnissa neljällä uudella tuetolla havainnolla. Näyte ei
      todista kaikkien kymmenen faktan säilymistä.
  boundaries:
    in_scope:
      - Suomenkielisten annettujen lukusanojen ja tavallisten pystyasentoisten
        numeromerkintöjen 1–10 vastaavuus molempiin suuntiin. Merkintä 10 kuuluu
        rajaukseen ilman paikkajärjestelmätehtävää.
      - Tyypitetty koko faktajoukon mallikansi molempiin suuntiin, tuettu
        matching-harjoittelu, oma parivalinta, rajattu virheparin korjaus ja
        myöhempi näyte.
    out_of_scope:
      - Lukumäärän laskeminen, numeromerkkien kirjoittaminen, lukusanojen
        oma-aloitteinen suullinen tuottaminen, ääntäminen tai lukunopeuden
        arviointi.
      - Laaja numeerinen lukutaito, paikkajärjestelmän hallinta, määrän ja
        numeromerkin yhteys tai M-NUM-03-integraation hallinnan myöntäminen.
      - Mallin näkemisestä, maailman valmistumisesta, tuetusta onnistumisesta
        tai käänteisen suunnan näyttämisestä päätelty myönteinen tapausnäyttö.
  prerequisite_assumptions:
    - kc_id: M-NUM-STABLE-ORDER
      expected_level: Strong-tuki, ei pääsyn tai itsenäisen arvioinnin required-ehto.
        Ei uusia kovia esitietoja.
  conceptual_invariants:
    - Jokaisen faktaparin molemmat suunnat vaativat oman itsenäisen vastauksen,
      vaikka opetuksen altistustieto on faktakohtaisesti kaksisuuntainen.
    - Vain oppijan itse vahvistama oikea vaihtoehto tuottaa tämän suunnan ja
      arvon havaintoa.
    - Koko 20 tapauksen vaatimus säilyy process-roolina; atomista pisteytystä
      tai lapsi-KC:n automaattista hyvitystä ei tehdä.
    - Opetus/faded support ja tuettu korjaus ovat apua; uusi siemen, korttien
      paikka tai nimilappu ei poista historiaa.
  likely_confusions:
    - M-NUM-WORD-NUMERAL-OBS-PARI
lesson_blueprint:
  entry_state: DIAGNOSTIC
  default_path:
    - DIAGNOSTIC
    - ORIENT
    - WORKED_EXAMPLE
    - GUIDED_PRACTICE
    - FADED_EXAMPLE
    - INDEPENDENT_PRACTICE
    - TRANSFER_CHECK
    - MASTERY_GATE
  fast_path:
    enabled: false
  state_specs:
    DIAGNOSTIC:
      purpose: Katso molemmista suunnista, millaista tukea tarvitaan; alkukartoitus ei
        korvaa prosessin täyttä näyttöä.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-WORD-NUMERAL-DIAG-SANALAPPU
              - M-NUM-WORD-NUMERAL-DIAG-NUMEROLAPPU
    ORIENT:
      purpose: Anna numerolapuille arkinen käyttötarkoitus ilman esineiden määrän
        laskemista.
      blocks:
        - type: explanatory_text
          content: Loikka laittaa retkitarvikkeet numeroituihin säilytyspaikkoihin. Aavan
            listassa luvut ovat sanoina. Autetaan heitä löytämään yhteen
            kuuluvat laput.
    WORKED_EXAMPLE:
      purpose: Näytä jokaiseen kymmenestä faktasta todellinen pari molempiin suuntiin
        tyypitetyn mallikannen kautta.
      blocks:
        - type: worked_example
          content:
            representation_ref: M-NUM-WORD-NUMERAL-JOURNEY
            description: Aava yhdistää sanan yksi numerolappuun 1. Sitten hän lähtee lapusta
              1 ja valitsee sanan yksi. Sama kaksisuuntainen malli näytetään
              kannen kaikille arvoille. Mallin toimitus kirjataan vain oikeasti
              näytettyjen parien osalta.
    GUIDED_PRACTICE:
      purpose: Anna oppijan valita itse tutuilla toiminnoilla; pyydetty näkyvä
        tukipari vastaa juuri käsiteltävää faktaa.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-WORD-NUMERAL-GUIDED-SANASTA
              - M-NUM-WORD-NUMERAL-GUIDED-MERKINNASTA
    FADED_EXAMPLE:
      purpose: Poista näkyvä tukipari ja esivalinta. Oppija tekee oman valinnan; vaihe
        pysyy tuettuna harjoitteluna.
      blocks:
        - type: explanatory_text
          content: Nyt mallipari menee piiloon. Katso annettua lappua ja valitse sen pari
            itse. Apua saa yhä pyytää.
        - type: question
          content:
            item_refs:
              - M-NUM-WORD-NUMERAL-GUIDED-SANASTA
              - M-NUM-WORD-NUMERAL-GUIDED-MERKINNASTA
    INDEPENDENT_PRACTICE:
      purpose: Kerää aidot 20 tuetonta matching-päätöstä molemmista suunnista ilman
        mallia tai oikean vastauksen korostusta.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-WORD-NUMERAL-INDEP-LAATIKON-OSOITE
              - M-NUM-WORD-NUMERAL-INDEP-SANALISTA
    TRANSFER_CHECK:
      purpose: Korjaa oikeasti väärä yhteys. Ensimmäinen opetettu fakta vaaditaan
        molemmista suunnista; kuvien vaihtuminen ei ole soveltamisnäyttö.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-WORD-NUMERAL-APPFIRST-SANALAPUN-KORJAUS
              - M-NUM-WORD-NUMERAL-APPFIRST-MERKINNAN-KORJAUS
    MASTERY_GATE:
      purpose: Säilytä sana/merkintä-prosessin rajat ja tarinan onnistuminen erillään
        hallinnasta.
      blocks:
        - type: reflection
          content: Miksi numerolapun paikka ei kerro, mikä lukusana siihen kuuluu? Voit
            miettiä tai kertoa ajatuksesi. Pohdintaa ei pisteytetä.
    DELAYED_REVIEW:
      purpose: Myöhempi neljän uuden havainnon edustava näyte arvoista yksi ja
        kymmenen molempiin suuntiin.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-WORD-NUMERAL-DELAY-SANASTA
              - M-NUM-WORD-NUMERAL-DELAY-MERKINNASTA
