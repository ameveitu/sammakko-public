misconceptions:
  - id: M-NUM-STABLE-ORDER-HYP-JONO
    description: "Vastauksen sanajono ei vastaa pyydettyä tavanomaista järjestystä: siinä voi olla poisjättö,
      toisto, vaihtunut järjestys tai ylimääräinen sana. Havainto ei todista syytä eikä esineiden
      seurantataitoa."
    evidence_patterns:
      - kind: interaction_pattern
        when: Hyvin muodostetun vastauksen deterministinen havainto observed:stable_order. Jatkossa verrataan vain
          pyydettyä jaksoa, ydin- ja viivästetyssä näytössä koko yhdestä alkavaa jonoa.
    feedback_strategy:
      conceptual_prompt: Miten voit tarkastella oman jonosi sanojen järjestystä suhteessa siihen, mistä piti
        aloittaa ja mihin lopettaa?
      representation: Oma muokattava sanajono ja kokonainen sekoitettu sanavalikoima. Ei virhejonoa korjattavaksi,
        oikean seuraavan sanan osoitusta tai valmiiksi täytettyä alkua.
    repair_targets:
      - M-NUM-STABLE-ORDER
    status: hypothesis
differentiation:
  support_variants:
    step_chunking: Opetetaan malli yhdestä neljään ennen ohjattua neljän jonoa. Seuraavassa opetuksessa
      mallinnetaan jatkot viisi–kuusi ja seitsemän–kahdeksan sekä täydet jonot kuuteen ja kahdeksaan ennen
      niiden ohjattua harjoittelua. Itsenäisen ja viivästetyn täyden jonon ehdot ja onnistumismäärät pysyvät
      muuttumattomina.
    hint_availability: Kolme pyydettävää prosessivihjettä jokaisessa tehtävässä. Tuki ja vihjeet pysyvät
      avustettuina; ohjelma ei lisää sanoja eikä paljasta jatkotehtävän jaksoa.
    text_density: Lyhyet toimintaohjeet ja erikseen kuunneltavat paikalliset suomalaiset lukusanat. Tämä ei ole
      lupaus muun oppituntitekstin puhetoistosta.
    alternate_representation: Sanojen kuuntelu ja nykyinen näppäimistökäyttö, ilman numeroita, oikeinkirjoitusta
      tai laskettavia kohteita.
    reduced_motion: Sanojen järjestyksen muodostaminen ei edellytä liikkuvan esityksen seuraamista. Nykyinen
      vähennetyn liikkeen tuki säilyttää saman tavoitteen.
  challenge_variants:
    learner_prompt: "Sanavalikoiman paikat vaihtuvat, mutta lukusanajono ei. Selitä, miksi voit rakentaa saman
      jonon silti. Kun annetaan sana neljä, voit ajatella mielessäsi jonon alusta tai jatkaa tutusta kohdasta:
      miksi vastaukseen tarvitaan kummallakin tavalla sama pyydetty jakso?"
    reduced_scaffolding: Ohjattu harjoittelu ohitetaan nykyisen haastepolun mukaisesti; itsenäiset täyden jonon
      ehdot pysyvät samoina.
    alternate_solution_compare: Vertaa mielessä yhdestä etenemistä ja tutusta sanasta jatkamista ilman nopeus- tai
      ilman-uudelleenlaskentaa-vaatimusta. Pohdintaa ei pisteytetä suulliseksi muistamiseksi.
    transfer_novelty: Kaikki itsenäiset pohjat alkavat yhdestä ja päättyvät kahdeksaan. Vain siirto alkaa annetun
      neljän jälkeen ja tuottaa erillisen jatkotunnisteen.
    acceleration_probe: Täyden jonon kaksi diagnostista onnistumista mahdollistavat nopean polun; jatkosiirto ja
      vähintään kolme itsenäistä onnistumista säilyvät.
