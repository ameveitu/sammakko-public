kc_id: M-NUM-QTY-WORD
catalog_version: STEM_KC_Catalogs_v0.2
metadata:
  title: Lukumäärän yhdistäminen sitä vastaavaan lukusanaan
  subject: mathematics
  grade_band: 1-2
  mastery_role: process
  node_kind: representation
  concept_path:
    - Matematiikka
    - Luvut ja laskutoimitukset
    - Lukumäärän representaatiot
  source_basis: pedagogically_derived
  curriculum_refs:
    - OPH-POPS2014-MATH-VL1-2-S2
  prerequisite_snapshot:
    hard:
      - M-NUM-02
    strong: []
    helpful: []
teaching_model:
  learning_goal: Oppilas yhdistää kolmen–kuuden erillisen esineen koko ryhmän sitä vastaavaan suomen lukusanaan
    ja annetusta lukusanasta valmiiseen vastaavaan ryhmään. Process-näyttö vaatii kaikki kahdeksan
    suunta/arvo-tapausta alueella 3–6.
  learner_facing_goal: Löydän ryhmälle sen määrää tarkoittavan sanan ja sanalle sopivan ryhmän.
  core_idea: Sana neljä tarkoittaa koko neljän esineen määrää. Ryhmän leveys, esineiden koko tai väri ei
    ratkaise sanaa. Sama yhteys toimii myös sanasta valmiin ryhmän valintaan ilman numeromerkkiä välissä.
  success_evidence:
    - "Antaa oman tuettoman vahvistetun vastauksen jokaisessa neljän arvon 3,4,5,6 molemmassa suunnassa:
      yhteensä kahdeksan erillistä tapausta."
    - Yhdistää koko näkyvän määrän sanaan ilman järjestelmän laskuria, numeromäärävihjettä tai automaattista
      loppusanaa. Omaa rauhallista laskemista ei kielletä.
    - Korjaa todellisen väärän ryhmä–sana-parin ensimmäisestä opetetusta kolmen faktasta molemmissa suunnissa.
      Kolme vaihtoehtoa estää pelkän eri kumppanin valinnan riittämisen.
    - Vähintään 24 tunnin jälkeen antaa neljä uutta tuetonta havaintoa määristä kolme ja kuusi molempiin
      suuntiin. Tämä on rajattu edustava näyte, ei kaikkien neljän faktan täydellinen säilymisnäyttö.
  boundaries:
    in_scope:
      - Näkyvät erilliset esineryhmät 3–6 ja annetut suomen lukusanat kolme–kuusi molempiin suuntiin. Määrä
        voidaan tunnistaa tai laskea itse.
      - Rivi- ja hajautettu asettelu, koko ryhmän vastaavuus, vaihtoehdon valinta ja aidosti eri arvoisen
        parin korjaus.
      - Yhteys esitetään määrän ja sanan välillä ilman tarjottua numeromerkkiä välittäjänä.
    out_of_scope:
      - Määrät 1–2 tai 7–10, Give-N eli pyydetyn joukon rakentaminen suuremmasta joukosta,
        lisääminen/poistaminen tai laskutoimitukset.
      - Spontaani suullinen tuottaminen, ääntäminen, numeromerkkien tunnistaminen, lukunopeus tai
        M-NUM-03-integraation hallinta.
      - M-NUM-02:n same-members-kronologian tai lapsitaitojen hallinnan myöntäminen tästä valmiin ryhmän
        valinnasta.
  prerequisite_assumptions:
    - kc_id: M-NUM-02
      expected_level: "Required-esitieto ja all_of-ryhmän ainoa jäsen: ajantasainen yhteensopiva hankinta ennen
        itsenäistä arviointia. Pelkkä tuettu tutustuminen ei täytä sitä; erillistä kalenteriodotusta ei
        lisätä."
  conceptual_invariants:
    - Lukusana viittaa koko ryhmän määrään, ei viimeiseen tai suurimpaan esineeseen.
    - Oppijan oma parivalinta tuottaa yhden suunnan ja määrän havaintoa. Esitietojen hallintaa tai toisen
      suunnan onnistumista ei päätellä siitä.
    - Järjestelmän annettu lukumäärä tai automaattinen laskusana tekisi samasta vastauksesta tuetun; oma
      laskeminen pysyy sallittuna strategiana.
    - Koko kahdeksan tapauksen vaatimus säilyy process-roolina. Kolme onnistumista ja kaksi pohjaa ovat vain
      lisäminimit.
    - Tyypitetty malli näyttää kaikki neljä määrää molempiin suuntiin. Faktan näyttäminen/tuettu vastaus eivät
      anna myönteistä itsenäistä näyttöä.
  likely_confusions:
    - M-NUM-QTY-WORD-OBS-PARI
lesson_blueprint:
  entry_state: DIAGNOSTIC
  default_path:
    - DIAGNOSTIC
    - ORIENT
    - WORKED_EXAMPLE
    - GUIDED_PRACTICE
    - FADED_EXAMPLE
    - INDEPENDENT_PRACTICE
    - TRANSFER_CHECK
    - MASTERY_GATE
  fast_path:
    enabled: false
  state_specs:
    DIAGNOSTIC:
      purpose: Tarkastele määrän ja sanan yhteyttä molemmista suunnista esitiedon M-NUM-02 voimassa ollessa.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-WORD-DIAG-RYHMAN-LAPPU
              - M-NUM-QTY-WORD-DIAG-SANAN-RYHMA
    ORIENT:
      purpose: Anna koko ryhmän sanalle tarkoitus pakkaamisessa, ilman vaaditun joukon rakentamistehtävää.
      blocks:
        - type: explanatory_text
          content: Aava on koonnut retkitarvikkeet pieniin ryhmiin. Loikka tekee niille sanalaput. Valitaan jokaiselle
            ryhmälle sen määrää vastaava sana ja listan sanalle valmis ryhmä.
    WORKED_EXAMPLE:
      purpose: Näytä kolmen–kuuden faktat molempiin suuntiin tyypitetyllä kannella, ei numeromerkin kautta.
      blocks:
        - type: worked_example
          content:
            representation_ref: M-NUM-QTY-WORD-JOURNEY
            description: Aava tarkistaa kolme esinettä ja liittää koko ryhmään sanan kolme. Sitten sana kolme on annettu
              ja hän valitsee kolmen esineen ryhmän muiden valmiiden ryhmien joukosta. Sama tehdään määrille
              neljä, viisi ja kuusi. Näyttämisen kirjaus koskee vain oikeasti toimitettua riviä.
    GUIDED_PRACTICE:
      purpose: Oppija valitsee itse molemmista suunnista. Pyydetty mallipari näyttää juuri nykyisen määrän ja sanan,
        ei valmista omaa vastausta.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-WORD-GUIDED-RYHMASTA
              - M-NUM-QTY-WORD-GUIDED-SANASTA
    FADED_EXAMPLE:
      purpose: Piilota mallipari, laskurin tulos ja oikea valinta; säilytä tuttu toiminto ja mahdollisuus pyytää apua.
      blocks:
        - type: explanatory_text
          content: Nyt tukipari menee piiloon. Tarkista ryhmä itse ja valitse pari. Saat laskea rauhassa. Tämä on vielä
            harjoittelua.
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-WORD-GUIDED-RYHMASTA
              - M-NUM-QTY-WORD-GUIDED-SANASTA
    INDEPENDENT_PRACTICE:
      purpose: Kerää kahdeksan omaa tuetonta määrän/sanan paripäätöstä alueelta 3–6; ei vain yhden tutun kuvion
        tunnistamista.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-WORD-INDEP-PAKKAUSLAPPU
              - M-NUM-QTY-WORD-INDEP-TARVIKERYHMA
    TRANSFER_CHECK:
      purpose: Vaihda väärä ryhmän sana tai sanaan liitetty ryhmä oikeaksi. Ensimmäinen opetettu kolmen fakta
        vaaditaan molemmista suunnista.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-WORD-APPFIRST-RYHMAN-SANALAPPU
              - M-NUM-QTY-WORD-APPFIRST-SANAN-ESINERYHMA
    MASTERY_GATE:
      purpose: Pidä ryhmän määrän merkitys näkyvissä ilman uutta pisteytettävää puhe- tai kirjoitustehtävää.
      blocks:
        - type: reflection
          content: Jos samat esineet levitetään kauemmas toisistaan, pitääkö sanalappu vaihtaa? Miksi? Saat tarkistaa
            laskemalla. Pohdintaa ei pisteytetä.
    DELAYED_REVIEW:
      purpose: Myöhempi neljän uuden havainnon näyte kolmen ja kuuden yhteyksistä molempiin suuntiin.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-WORD-DELAY-RYHMASTA
              - M-NUM-QTY-WORD-DELAY-SANASTA
