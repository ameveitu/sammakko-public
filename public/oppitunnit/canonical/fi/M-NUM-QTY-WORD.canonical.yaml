misconceptions:
  - id: M-NUM-QTY-WORD-OBS-PARI
    description: Vahvistettu sana ei vastaa koko näytetyn ryhmän määrää tai valittu valmis ryhmä ei vastaa sanaa.
      Havainto ei osoita kardinaliteetin puutetta tai muuta lapsitaitodiagnoosia.
    evidence_patterns:
      - kind: committed_relation_error
        when: Oppija vahvistaa vaihtoehdon, joka ei vastaa vihjeen arvoa. Keskeneräistä tai vahvistamatonta vastausta
          ei nimetä tällä havainnolla.
    feedback_strategy:
      conceptual_prompt: Sana ja ryhmän määrä eivät vielä täsmää. Katsotaan koko ryhmää ja tarkistetaan se yhdessä
        esine kerrallaan. Sana tarkoittaa kaikkia tämän ryhmän esineitä.
      representation: Näytä pyydettäessä nykyiseen faktaan sidottu tyypitetty mallipari. Se on tukea; väärä vastaus
        tai tarjottu malli ei muutu itsenäiseksi näytöksi.
    repair_targets:
      - M-NUM-QTY-WORD
    status: hypothesis
differentiation:
  support_variants:
    step_chunking: Yksi koko ryhmä tai sana vihjeenä ja yksi parivalinta kerrallaan. Malli etenee määrissä kolme,
      neljä, viisi ja kuusi.
    hint_availability: Avun voi pyytää ennen virhettä; näytettävä tukipari sidotaan nykyiseen faktaan.
      Automaattinen laskusana on tukea.
    text_density: Lyhyt ohje, selvästi erotettavat esineet ja suuret vaihtoehtokortit. Ei esineiden nimeämistä,
      määräsyötekenttää tai kuulokuittausta.
    representation_boundary: Sana on tekstinä annettu tai valinnaisesti luettu; annettu sanamuoto ei ole oppijan
      spontaania puhetta. Numeromerkkiä ei tarjota välivastaukseksi.
    reduced_motion: Kuvat voi näyttää paikallaan; vastaamiseen ei liity aikapainetta.
    optional_audio: Ääni on valinnainen ja aluksi pois. Tekstireitti toimii ilman puhepalvelua tai kuulemisen
      kuittausta. Sanan nimiluku ei ole oppijan spontaania puhetta eikä kuulemisen havainto.
  challenge_variants:
    learner_prompt: Loikka valitsee ryhmän, joka vie eniten tilaa. Aava levittää saman pienen ryhmän ja tiivistää
      suuremman ryhmän. Miksi leveys ei ratkaise sanalappua? Korjaa lisäksi valmiiksi väärä pari ja tarkista
      sama yhteys toiseen suuntaan.
    reduced_scaffolding: Määräalue pysyy kolmesta kuuteen. Vaikeus tulee koko ryhmän merkityksen ja ristiriitaisen
      parin tarkistamisesta, ei suuremmista luvuista.
    assessment_limit: Pohdintaa ei pisteytetä eikä tulkita M-NUM-02:n uudeksi hallinnaksi. Valmiin ryhmän valinta
      ei ole Give-N-rakentamista.
    transfer_novelty: Todellinen eriarvoisen parin korjaus vaatii oman korvaavan kumppanin. Pelkkä rivin hajautus
      tai tarinanimi ei ole soveltamisnäyttö.
