schema_version: 0.1.0
kc_id: M-NUM-QTY-NUMERAL
catalog_version: STEM_KC_Catalogs_v0.2
metadata:
  title: Lukumäärän yhdistäminen sitä vastaavaan numeromerkintään
  subject: mathematics
  grade_band: 1-2
  mastery_role: process
  node_kind: representation
  concept_path:
    - Matematiikka
    - Luvut ja laskutoimitukset
    - Lukumäärän representaatiot
  source_basis: pedagogically_derived
  curriculum_refs:
    - OPH-POPS2014-MATH-VL1-2-S2
  prerequisite_snapshot:
    hard:
      - M-NUM-02
    strong: []
    helpful: []
teaching_model:
  learning_goal: Oppilas yhdistää näkyvän 3–6 esineen ryhmän numeromerkkiin ja numeromerkin vastaavaan
    valmiiseen ryhmään. Molempien suuntien kahdeksan tapausta arvioidaan erikseen.
  learner_facing_goal: Löydän rasiaan sopivan numerolapun.
  core_idea: Numero kertoo koko ryhmän määrän. Esineiden koko, väri tai asettelu ei muuta määrää.
  success_evidence:
    - Valitsee itse numeromerkin kunkin määrän3,4,5,6 perusteella ja oikean ryhmän jokaisesta numeromerkistä.
    - Korjaa aidosti väärän määrä–numero-parin molempiin suuntiin. Väärä alkupari ei poista kaikkia vääriä
      vaihtoehtoja.
    - Antaa vähintään24h jälkeen neljä uutta tuetonta vastausta ensimmäisestä ja viimeisestä faktasta
      molempiin suuntiin. Tämä on edustava näyte, ei yleinen säilymisväite.
  boundaries:
    in_scope:
      - Määrät3–6, desimaaliset numeromerkit3–6 ja molemmat vastaavuussuunnat.
      - Oma rauhallinen laskeminen, erilliset näkyvät esineet, rivit ja hajautetut ryhmät, aidon väärän parin
        korjaus.
    out_of_scope:
      - Kirjoitettujen lukusanojen tunnistus, spontaani puhe tai ääntäminen.
      - Give-N-rakentaminen, numeroiden käsin kirjoittaminen, laskutoimitukset tai kolmen esitysmuodon
        integraatio.
      - Automaattinen laskuri tai numeroon liitetty pistemäärä itsenäisenä numerotaitona.
  prerequisite_assumptions:
    - kc_id: M-NUM-02
      expected_level: "Required-esitieto ja all_of-ryhmän ainoa jäsen: ajantasainen yhteensopiva hankinta ennen
        itsenäistä arviointia. Pelkkä tuettu tutustuminen ei täytä sitä; erillistä kalenteriodotusta ei
        lisätä."
  conceptual_invariants:
    - Koko ryhmän määrä ratkaisee numerolapun, ei esineen nimi tai ryhmän leveys.
    - Jokainen oma vastaus osoittaa vain kyseisen suunnan ja arvon; ei toisen suunnan tai prerequisite-KC:n
      hallintaa.
    - Mallipari, vihje tai automaattinen laskenta on tukea. Oma tapauksen mukainen palauttaminen vaatii
      erillisen todellisen vastauksen.
    - Kahdeksan tapauksen process-rajaa ei korvata onnistumisten yleisminimillä.
  likely_confusions:
    - M-NUM-QTY-NUMERAL-OBS-PARI
lesson_blueprint:
  entry_state: DIAGNOSTIC
  default_path:
    - DIAGNOSTIC
    - ORIENT
    - WORKED_EXAMPLE
    - GUIDED_PRACTICE
    - FADED_EXAMPLE
    - INDEPENDENT_PRACTICE
    - TRANSFER_CHECK
    - MASTERY_GATE
  fast_path:
    enabled: false
  state_specs:
    DIAGNOSTIC:
      purpose: Kokeile määrä–numero-yhteyttä molempiin suuntiin.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-NUMERAL-DIAG-RYHMAN-LAPPU
              - M-NUM-QTY-NUMERAL-DIAG-SANAN-RYHMA
    ORIENT:
      purpose: Anna numerolapulle tarkoitus Aavan retkirasioissa.
      blocks:
        - type: explanatory_text
          content: Aavan rasiat tarvitsevat numerolaput. Valitse rasiaan sopiva numero.
    WORKED_EXAMPLE:
      purpose: Näytä kaikki neljä koko ryhmän ja numeron yhteyttä molempiin suuntiin.
      blocks:
        - type: worked_example
          content: Katso ryhmää ja numeroa. Ne kertovat saman määrän.
    GUIDED_PRACTICE:
      purpose: Valitse pari näkyvän mallin avulla.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-NUMERAL-GUIDED-RYHMASTA
              - M-NUM-QTY-NUMERAL-GUIDED-SANASTA
    FADED_EXAMPLE:
      purpose: Kokeile paria ilman mallia; tämä vaihe on vielä harjoittelua.
      blocks:
        - type: explanatory_text
          content: Katso ryhmää ja numeroa. Ne kertovat saman määrän.
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-NUMERAL-GUIDED-RYHMASTA
              - M-NUM-QTY-NUMERAL-GUIDED-SANASTA
    INDEPENDENT_PRACTICE:
      purpose: Valitse itse jokaisen määrän numero ja jokaisen numeron ryhmä.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-NUMERAL-INDEP-PAKKAUSLAPPU
              - M-NUM-QTY-NUMERAL-INDEP-TARVIKERYHMA
    TRANSFER_CHECK:
      purpose: Korjaa aidosti väärä numerolappu tai valmis ryhmä.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-NUMERAL-APPFIRST-RYHMAN-SANALAPPU
              - M-NUM-QTY-NUMERAL-APPFIRST-SANAN-ESINERYHMA
    MASTERY_GATE:
      purpose: Tarkista kaikki vaaditut omat tapaukset ja soveltaminen.
      blocks:
        - type: reflection
          content: Katso ryhmää ja numeroa. Ne kertovat saman määrän.
    DELAYED_REVIEW:
      purpose: Palaa myöhemmin uusiin omiin määrä–numero-päätöksiin.
      blocks:
        - type: question
          content:
            item_refs:
              - M-NUM-QTY-NUMERAL-DELAY-RYHMASTA
              - M-NUM-QTY-NUMERAL-DELAY-SANASTA
assessment_blueprint:
  diagnostic:
    localized_child_repairs: {}
    minimum_templates: 2
    fast_path_confirmation_tags:
      - association_resolved
    execution_policy: Kaksi alkukartoitusta auttaa valitsemaan tuen. Fast path on pois käytöstä, eikä diagnoosi
      korvaa koko prosessin itsenäistä tapauskattavuutta.
    pass_rule: Molemmat vastaavuuspäätökset kirjataan todellisina havaintoina. Väärä pari ei paikanna puutetta
      lapsi-KC:hen.
  independent:
    minimum_successes: 3
    template_diversity: 2
    max_supported_attempts_counted: 0
    required_tags:
      - association_resolved
  transfer:
    required: true
    minimum_successes: 2
    novel_context_required: true
  delayed:
    required: true
    minimum_successes: 4
    minimum_delay_hours: 24
    reuse_templates: []
    required_tags:
      - association_resolved
    required_contexts: []
    earliest_delay_policy: Vähintään 24 tuntia koko hankintanäytön täyttymisestä; myöhemmässä istunnossa tai
      toisen osaamiskohteen jälkeen neljä uutta tuetonta havaintoa. Ensimmäinen ja viimeinen arvo molemmissa
      suunnissa ovat rajattu näyte, eivät koko faktajoukon säilymisnäyttö. Ajastus ja onnistumisrajat ovat
      projektipäätöksiä.
  supported_evidence:
    counts_as_mastery: false
  misconception_clearance:
    - misconception_id: M-NUM-QTY-NUMERAL-OBS-PARI
      evidence_tags:
        - association_resolved
      rule: Myöhempi tueton oikea relaatiopäätös poistaa tämän tehtäväkohtaisen aktiivisen havaintomerkinnän
        nykyisessä politiikassa. Se ei vahvista aiemman virheen syytä tai korvaa koko prosessin erikseen
        vaadittuja tapauksia.
