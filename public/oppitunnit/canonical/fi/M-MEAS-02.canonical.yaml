schema_version: 0.1.0
kc_id: M-MEAS-02
catalog_version: STEM_KC_Catalogs_v0.2
metadata:
  title: Pituuden ymmärtäminen suureeksi
  subject: mathematics
  grade_band: 1-2
  mastery_role: atomic
  node_kind: concept
  concept_path:
    - Matematiikka
    - Geometria ja mittaaminen
    - Pituus
  source_basis: pedagogically_derived
  curriculum_refs:
    - OPH-POPS2014-MATH-VL1-2-S3
  prerequisite_snapshot:
    hard:
      - M-MEAS-00
    strong: []
    helpful: []
teaching_model:
  learning_goal: Oppilas vertaa listan päästä-päähän-pituutta ennen ja jälkeen jäykän siirron sekä
    todellisen lyhennyksen/pidennyksen. Rajattu sovellus yhdistää 90 asteen käännön tekijöihin 1/2,1,2
    samassa tehtäväpohjassa ja erottaa lyhyemmän, yhtä pitkän ja pidemmän lopputilan.
    Atomic/concept-tulkinta ei osoita yksikkömittausta, kaikkia suureita tai ilman nimettyä kysymystä
    tapahtuvaa pituuden tunnistamista.
  learner_facing_goal: Huomaan, muuttuiko listan pituus vai vain sen paikka tai suunta.
  core_idea: Pituus kuvaa listan matkaa päästä päähän. Jäykkä lista säilyy yhtä pitkänä siirrettäessä tai
    käännettäessä. Oikea lyhennys tai jatkaminen muuttaa pituutta.
  success_evidence:
    - "Tuettomat lyhyempi/yhtä pitkä/pidempi-päätökset kaikista kolmesta ydintoiminnosta: siirto,
      lyhennys ja pidennys."
    - "Kolme omaa tuetonta ja aidosti novel-soveltamishavaintoa: kääntö+suhde lyhyempi, yhtä pitkä ja
      pidempi. Yksi tehtäväpohja tuottaa kaikki kolme; sama luokka toistettuna ei täytä
      required_tags-kattavuutta."
    - Myöhempi neljän päätöksen näyte sisältää siirron, käännön ja molemmat aidot muutokset. Ei kaikkien
      suureiden, fyysisen mittaustarkkuuden tai yleisen säilymiskäsitteen näyttöä.
  boundaries:
    in_scope:
      - Jäykkä suora segmentti, yhteinen asteikko, näkyvät ennen/jälkeen-tilat ja kolme pituussuhdetta.
      - Paikan muutos, 90 asteen kääntö sekä aidosti puolitettu tai kaksinkertaistettu pituus; ei
        numeerista vastausta.
    out_of_scope:
      - Numeromittaus, yksiköt, yksikkömuunnos, pinta-ala, massa, tilavuus tai ajan suure.
      - Mutkalle asetetun köyden kaaripituus, perspektiivi tai venyvän aineen fysiikka.
      - Ominaisuuden tunnistamista mikä näistä on pituus ei arvioida kolmen suhteen valinnalla;
        tavoitekattavuuden aukko säilyy.
  prerequisite_assumptions:
    - kc_id: M-MEAS-00
      expected_level: Required-esitieto ja all_of-ryhmän ainoa jäsen. Itsenäinen näyttö vaatii ajantasaisen
        yhteensopivan hallinnan; sitä ei myönnetä tästä taaksepäin.
  conceptual_invariants:
    - Molemmat kuvat säilyvät näkyvissä. Asteikko ei sovitu kumpaankin erikseen; myös vinon listan
      akselit käyttävät samaa kerrointa.
    - Oppija valitsee pituussuhteen. Järjestelmä antaa kuvat ja vastauslaatat mutta ei muunnoksen
      tuomiota.
    - Sekä säilyvä että aidosti muuttuva pituus vaaditaan. Aina yhtä pitkä ja kaikki liike muuttaa eivät
      läpäise ydinkattavuutta.
  likely_confusions:
    - M-MEAS-02-OBS-PITUUSSUHDE
lesson_blueprint:
  entry_state: DIAGNOSTIC
  default_path:
    - DIAGNOSTIC
    - ORIENT
    - WORKED_EXAMPLE
    - GUIDED_PRACTICE
    - FADED_EXAMPLE
    - INDEPENDENT_PRACTICE
    - TRANSFER_CHECK
    - MASTERY_GATE
  fast_path:
    enabled: false
  state_specs:
    DIAGNOSTIC:
      purpose: Havaitse säilymisen ja aidon muutoksen ero ilman esitiedon uudelleenmyöntämistä.
      blocks:
        - type: question
          content:
            item_refs:
              - M-MEAS-02-DIAG-SIIRTO
              - M-MEAS-02-DIAG-PIDENNYS
    ORIENT:
      purpose: Aava siirtää Loikan suoran listan pöydältä telineeseen. Hän tarkistaa, onko lista edelleen
        samanpituinen vai tarvitseeko suunnitelmaa vaihtaa.
      blocks:
        - type: explanatory_text
          content: Autetaan Aavaa tarkistamaan listan pituus ennen ja jälkeen.
    WORKED_EXAMPLE:
      purpose: Työstä siirto ja kaksi aitoa muutosta. Kääntö on mukana myöhemmässä rajatussa tarkistuksessa;
        aito soveltamispankki puuttuu.
      blocks:
        - type: worked_example
          content:
            givens:
              kind: attribute_comparison_task_v1
              context: Aavan siirretty lista
              operator: compare_length
              scale:
                kind: common_logical_scale_v1
                unit: logical
                svgUnitsPerUnit: 2
              before:
                kind: rigid_straight_segment_v1
                id: target
                colour: blue
                start:
                  x: 35
                  y: 35
                end:
                  x: 43
                  y: 35
              after:
                kind: rigid_straight_segment_v1
                id: target
                colour: blue
                start:
                  x: 40
                  y: 30
                end:
                  x: 48
                  y: 30
              transformation:
                kind: translation
                dx: 5
                dy: -5
              options:
                - id: choice-1
                  relation: shorter
                  label: Lyhyempi
                - id: choice-2
                  relation: equal
                  label: Yhtä pitkä
                - id: choice-3
                  relation: longer
                  label: Pidempi
            steps:
              - Aava siirtää koko listaa. Ennen- ja jälkeen-kuvat pysyvät rinnakkain samalla asteikolla.
              - Aava vertaa matkaa listan päästä toiseen. Se on sama; vain paikka vaihtui.
            conclusion: Aava valitsee yhtä pitkä. Paikan muutos ei pidentänyt listaa.
            implementation_boundary: Alkuperäiset työvaiheet ja tarkat domain-givens vastaavat tämän draftin
              attribute_examples_v1-mallin core-esimerkkejä. Helperin matemaattinen validointi ei hyväksy
              rendererin, tuen tai altistuksen normaalia reittiä; ne ja sisältöarvio kuuluvat mainin
              integraatioon.
        - type: worked_example
          content:
            givens:
              kind: attribute_comparison_task_v1
              context: Aavan lyhennetty lista
              operator: compare_length
              scale:
                kind: common_logical_scale_v1
                unit: logical
                svgUnitsPerUnit: 2
              before:
                kind: rigid_straight_segment_v1
                id: target
                colour: blue
                start:
                  x: 35
                  y: 35
                end:
                  x: 43
                  y: 35
              after:
                kind: rigid_straight_segment_v1
                id: target
                colour: blue
                start:
                  x: 35
                  y: 35
                end:
                  x: 39
                  y: 35
              transformation:
                kind: resize
                numerator: 1
                denominator: 2
              options:
                - id: choice-1
                  relation: shorter
                  label: Lyhyempi
                - id: choice-2
                  relation: equal
                  label: Yhtä pitkä
                - id: choice-3
                  relation: longer
                  label: Pidempi
            steps:
              - Jälkeen-listan pää jää alkuperäisen listan puoliväliin yhteisellä asteikolla.
              - Aava vertaa näkyvien päiden välistä matkaa. Tämä on oikea lyhennys eikä koko listan
                siirto.
            conclusion: Aava valitsee lyhyempi. Oppijan ei tarvitse antaa numeroa.
            implementation_boundary: Alkuperäiset työvaiheet ja tarkat domain-givens vastaavat tämän draftin
              attribute_examples_v1-mallin core-esimerkkejä. Helperin matemaattinen validointi ei hyväksy
              rendererin, tuen tai altistuksen normaalia reittiä; ne ja sisältöarvio kuuluvat mainin
              integraatioon.
        - type: worked_example
          content:
            givens:
              kind: attribute_comparison_task_v1
              context: Aavan jatkettu lista
              operator: compare_length
              scale:
                kind: common_logical_scale_v1
                unit: logical
                svgUnitsPerUnit: 2
              before:
                kind: rigid_straight_segment_v1
                id: target
                colour: blue
                start:
                  x: 35
                  y: 35
                end:
                  x: 43
                  y: 35
              after:
                kind: rigid_straight_segment_v1
                id: target
                colour: blue
                start:
                  x: 35
                  y: 35
                end:
                  x: 51
                  y: 35
              transformation:
                kind: resize
                numerator: 2
                denominator: 1
              options:
                - id: choice-1
                  relation: shorter
                  label: Lyhyempi
                - id: choice-2
                  relation: equal
                  label: Yhtä pitkä
                - id: choice-3
                  relation: longer
                  label: Pidempi
            steps:
              - Lista alkaa samasta kohdasta, mutta loppupää ulottuu pidemmälle.
              - Aava katsoo koko listan matkaa, ei vain alkupään pysymistä.
            conclusion: Aava valitsee pidempi. Myös saman alun lista voi muuttaa pituuttaan.
            implementation_boundary: Alkuperäiset työvaiheet ja tarkat domain-givens vastaavat tämän draftin
              attribute_examples_v1-mallin core-esimerkkejä. Helperin matemaattinen validointi ei hyväksy
              rendererin, tuen tai altistuksen normaalia reittiä; ne ja sisältöarvio kuuluvat mainin
              integraatioon.
    GUIDED_PRACTICE:
      purpose: Aava kohdistaa huomion päihin. Pyydetty päällekkäisvertailu on tukea; sitä ei väitetä
        nykyadapterin ominaisuudeksi.
      blocks:
        - type: explanatory_text
          content: Aava näyttää kummastakin kuvasta listan alun ja lopun. Katso koko matkaa niiden välillä, älä
            vain loppupään paikkaa.
        - type: explanatory_text
          content: Siirrossa molemmat päät liikkuvat yhdessä. Lyhennyksessä päiden väli pienenee; jatkamisessa se
            kasvaa. Kuvat ovat samalla asteikolla ja saavat jäädä rinnakkain.
        - type: explanatory_text
          content: Vertaa itse ja valitse lyhyempi, yhtä pitkä tai pidempi. Tarvittaessa pyydä Aavan
            päällekkäisvertailu tai mallivastaus; se on kirjattavaa tukea.
        - type: question
          content:
            item_refs:
              - M-MEAS-02-GUIDE-1
              - M-MEAS-02-GUIDE-2
              - M-MEAS-02-GUIDE-3
    FADED_EXAMPLE:
      purpose: Poista mallivastaus, vertailuhaamu ja ratkaisukorostus. Säilytä molemmat kuvat yhteisellä
        asteikolla.
      blocks:
        - type: explanatory_text
          content: Aavan vastaus ja vertailuhaamu poistuvat. Molemmat kuvat ja sama asteikko jäävät näkyviin. Tee
            oma päätös; voit edelleen pyytää apua.
        - type: question
          content:
            item_refs:
              - M-MEAS-02-FADE-1
              - M-MEAS-02-FADE-2
              - M-MEAS-02-FADE-3
    INDEPENDENT_PRACTICE:
      purpose: Sama kysymys kaikille kolmelle suhteelle. Ei muunnosnimeä, laskettua loppupituutta tai oikean
        vastauksen lukkoa.
      blocks:
        - type: question
          content:
            item_refs:
              - M-MEAS-02-CORE-1
              - M-MEAS-02-CORE-2
              - M-MEAS-02-CORE-3
    TRANSFER_CHECK:
      purpose: Aava tarkistaa eri suuntaan valmisteltuja listoja. Jokainen tapaus sisältää käännön ja aidon
        säilymisen/lyhentymisen/pidentymisen; oppija vertaa todellisia kuvia.
      blocks:
        - type: explanatory_text
          content: Aava tarkistaa telineeseen valmistellut listat. Katso listan pituutta ennen ja jälkeen ja tee
            oma valinta.
        - type: question
          content:
            item_refs:
              - M-MEAS-02-APP-KAANNA-JA-VERTAA
    MASTERY_GATE:
      purpose: Seuraus on tarkistettu pituuspäätös valmistelussa, ei fyysisen telineen valmistus tai kaikkien
        suureiden osaaminen.
      blocks:
        - type: explanatory_text
          content: Aava voi jatkaa listan valmistelua Loikan kanssa tarkistetun pituuspäätöksen avulla.
    DELAYED_REVIEW:
      purpose: Uusi tueton ennen/jälkeen-näyte sisältää kaikki neljä operaatiota.
      blocks:
        - type: question
          content:
            item_refs:
              - M-MEAS-02-LATER-1
              - M-MEAS-02-LATER-2
              - M-MEAS-02-LATER-3
              - M-MEAS-02-LATER-4
assessment_blueprint:
  diagnostic:
    localized_child_repairs: {}
    minimum_templates: 2
  independent:
    minimum_successes: 3
    template_diversity: 3
    required_tags:
      - length_translate
      - length_shorter
      - length_longer
    max_supported_attempts_counted: 0
  transfer:
    required: true
    minimum_successes: 3
    novel_context_required: true
    required_tags:
      - length_rotate_then_resize_shorter
      - length_rotate_then_resize_equal
      - length_rotate_then_resize_longer
  delayed:
    required: true
    minimum_successes: 4
    minimum_delay_hours: 24
    required_tags:
      - length_translate
      - length_rotate_90
      - length_resize_shorter
      - length_resize_longer
    required_contexts: []
    earliest_delay_policy: "Vähintään 24 tuntia hankinnan jälkeen: uusi tueton vastaus jokaiseen vaadittuun
      havaintoluokkaan. Ajan kuluminen tai mallin katsominen ei ole näyttöä."
  supported_evidence:
    counts_as_mastery: false
  misconception_clearance:
    - misconception_id: M-MEAS-02-OBS-PITUUSSUHDE
      evidence_tags:
        - length_translate
        - length_shorter
        - length_longer
      rule: Uudet tuettomat onnistumiset kaikista nimetyistä havaintoluokista. Virhehavainnon ajonaikainen
        sidonta on vielä toteutettava; tästä tekstistä ei myönnetä poistumista.
