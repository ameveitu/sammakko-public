misconceptions:
  - id: M-MEAS-02-OBS-PITUUSSUHDE
    description: Vahvistettu pituussuhde ei vastaa todellista päästä-päähän-pituutta. Yksi virhe ei yksilöi
      suunta-, paikka-, asteikko- tai kielistrategiaa.
    evidence_patterns:
      - kind: committed_relation_error
        when: Kelvollisesta vahvistetusta vaihtoehdosta palautuu comparison. Tyhjä tai vahvistamaton vastaus ei
          riitä.
    feedback_strategy:
      conceptual_prompt: Katsotaan molempia päitä ja verrataan niiden välistä matkaa samalla asteikolla. Pelkkä
        paikka tai suunta ei ratkaise pituutta.
      representation: Pyydettävä todellinen ennen/jälkeen-vertailu on tukea, ei uusi itsenäinen onnistuminen.
    repair_targets:
      - M-MEAS-02
    status: hypothesis
differentiation:
  support_variants:
    one_decision: Yksi kuvapari ja kolme suurta vastauslaattaa yhdessä työtilassa. Ei koordinaattisyöttöä tai
      äänikuittausta.
    fading: Mallivastaus, haamu ja ratkaisukorostus poistuvat. Kuvat ja yhteinen asteikko jäävät.
    support_boundary: assistance:none ei toteuta päällekkäisvertailua eikä guided-altistuskirjausta.
      Tarvitaan tyypitetty sidonta; purpose:guided ei yksin riitä.
    access: Erilliset pysäytyskuvat sallivat reduced motion -reitin. Valinnainen kielituki ei ole suullinen
      tuotos. M2_NONVISUAL_HOLD säilyy; tekstikoordinaatit eivät ratkaise vastaavuutta.
  challenge_variants:
    learner_prompt: "Loikka sanoo: jos loppupää siirtyy, lista pitenee. Aava näyttää kokonaan siirretyn
      listan ja oikeasti jatketun listan. Kummassa koko lista siirtyi ja kummassa sen pituus muuttui?"
    harder_reasoning: Vertaa kahta muutostapaa ja kumoa liian laaja sääntö. Ei suurempia lukuja tai
      pakollista selityslomaketta.
    capability_boundary: Toteutettu rotate_then_resize tuottaa käännettyjen säilyvien ja aidosti muuttuneiden
      listojen vastatapaukset. Varsinaiset näyttö-, tuki-, altistus-, journey- ja replay-sidonnat ovat
      mainin integraatiota; ei lisättyä semantic-choice-korviketta.
