      - Samat käyttökerrat muodostavat tavallisen lukusanajonon; osaehtojen erilliset onnistumiset eivät riitä.
      - Kaikki esineiden vierailujärjestykset ovat sallittuja.
      - Kohteita ja sanoja ei valita automaattisesti.
    provenance:
