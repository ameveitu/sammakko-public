differentiation:
  support_variants:
    step_chunking: Pysähdy ennen seuraavaa sanaa. Mieti erikseen, mihin esineeseen aiot osoittaa ja mitä sanaa
      aiot käyttää. Tarkista sitten oma tallentunut parisi. Tuki ei valitse esinettä eikä sanaa puolestasi.
    hint_availability: Kolme oppilaan pyytämää sanallista vihjetasoa. Vihje kirjautuu tuetuksi ennen
      paljastamista, eikä sen avulla tehty vastaus tuota itsenäistä näyttöä.
    text_density: Yksi lyhyt toimintajakso kerrallaan. Sanavalikoiman toisto on oppilaan käynnistämää paikallista
      kuuntelua, ei tehtävätekstin automaattista lukua.
    worked_example_depth: Opetuksen erillinen pieni esimerkki on tarkasteltavissa ennen ohjattua harjoitusta.
      Tuotoksen oikeaa jonoa tai jäsenvalintaa ei täytetä tehtävään.
    representation_boundary: Sama tavoite ja sama rajattu esinejoukko säilyvät; ei automaattista seuraavaa sanaa
      tai kohdetta, laskumerkintöjä, valitse kaikki -oikotietä eikä valmista lukumäärää.
    reduced_motion: Työ onnistuu näppäimistöllä ilman animaatiota tai aikarajaa. Laaja ruudunlukija- tai
      nonvisuaalisen oppimistavoitteen vastaavuus ei ole tällä sisällöllä hyväksytty.
  challenge_variants:
    learner_prompt: Kuvittele, että aloittaisit laskemisen toisesta merkistä. Miten voisit perustella, että sekä
      esineisiin kohdistaminen että lukusanojen järjestys pysyvät kunnossa? Käytä samaa pientä merkkijoukkoa.
    reduced_scaffolding: Oppilas perustelee oman reittinsä ja tarkistustapansa; sama pieni lukumääräalue ja tavoite pysyvät.
    alternate_solution_compare: Vertaa kahta mahdollista laskureittiä. Perustele, miten kummassakin näkyvät sekä
      sanajärjestys että esineiden kertakattavuus.
    assessment_limit: Pohdintaa ei pisteytetä eikä sen tekstiä käytetä hallinta-, syy- tai lapsievidenssinä.
      Haaste ei lisää numeroaluetta eikä uusia KC-tavoitteita.
