# Private validation admission; node acceptance remains pending.
schema_version: 0.1.0
kc_id: M-NUM-03
catalog_version: STEM_KC_Catalogs_v0.2
metadata:
  title: Lukumäärän, lukusanan ja numeromerkinnän yhdistäminen
  subject: mathematics
  grade_band: 1-2
  mastery_role: integration
  node_kind: integration
  concept_path:
    - Matematiikka
    - Luvut ja laskutoimitukset
    - Lukukäsite
    - Lukumäärän representaatiot
  source_basis: direct_curriculum
  curriculum_refs:
    - OPH-POPS2014-MATH-VL1-2-S2
  prerequisite_snapshot:
    hard:
      - M-NUM-QTY-WORD
      - M-NUM-QTY-NUMERAL
      - M-NUM-WORD-NUMERAL
    strong: []
    helpful: []
teaching_model:
  learning_goal: Oppilas yhdistää määrän, numeromerkin ja kirjoitetun lukusanan samaan kokonaisuuteen.
    Annetusta esitysmuodosta valitaan molemmat puuttuvat esitysmuodot; yhden parin onnistuminen ei
    riitä.
  learner_facing_goal: Löydän rasiaan numeron ja sanan.
  core_idea: Ryhmä, numero ja sana voivat kertoa saman määrän.
  success_evidence:
    - Valitsee molemmat puuttuvat kortit oikein ryhmästä3, numerosta4 ja sanasta viisi lähtien.
    - Korjaa ryhmän3 molemmat aidosti väärät laput itsenäisesti.
    - Vastaa myöhemmin kolmeen uuteen integroituun tehtävään ilman tukea.
  boundaries:
    in_scope:
      - Määrät3–5, numeromerkit ja suomen lukusanat. Kussakin tehtävässä yksi annettu esitysmuoto ja
        kaksi omaa valintaa.
      - Kolme eri lähtökohtaa sekä aidosti väärän lappukokonaisuuden korjaaminen.
    out_of_scope:
      - Esitietojen automaattinen myöntäminen integroidusta vastauksesta.
      - Laskutoimitukset, määrän rakentaminen tyhjästä, käsin kirjoittaminen, pakollinen puhe tai
        sanojen ääntäminen.
      - Kaikkien lukujen, arvojen ja esityssuuntien kattava hallinta. Kolme tapausta on MVP:n rajattu
        näyte.
  prerequisite_assumptions:
    - kc_id: M-NUM-QTY-WORD
      expected_level: Nykyisen politiikan mukainen todellinen yhteensopiva hankintanäyttö; kaikki kolme
        required-esitietoa. Ei lisättyä kalenteriodotusta.
    - kc_id: M-NUM-QTY-NUMERAL
      expected_level: Nykyisen politiikan mukainen todellinen yhteensopiva hankintanäyttö; kaikki kolme
        required-esitietoa. Ei lisättyä kalenteriodotusta.
    - kc_id: M-NUM-WORD-NUMERAL
      expected_level: Nykyisen politiikan mukainen todellinen yhteensopiva hankintanäyttö; kaikki kolme
        required-esitietoa. Ei lisättyä kalenteriodotusta.
  conceptual_invariants:
    - Molempien valintojen on kerrottava annettu määrä. Ensimmäinen valinta ei ratkaise toista
      automaattisesti.
    - Oma vastaus koskee vain integraatiota; ristiriita ei osoita yksittäistä virheen syytä tai
      esitietopuutetta.
    - Malli ja vihje ovat tukea. Oma fakta palautetaan vasta oikein tuetun kokonaisvastauksen ja
      suljetun opetusjakson jälkeen uudessa tehtävässä.
    - Mallin laajempi näkyvyys ei todista muiden faktojen harjoittelua.
  likely_confusions:
    - M-NUM-03-OBS-KOKONAISUUS
