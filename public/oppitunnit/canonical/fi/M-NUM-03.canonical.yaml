            item_refs:
              - M-NUM-03-DIAGNOSTIC-RYHMA
              - M-NUM-03-DIAGNOSTIC-NUMERO
              - M-NUM-03-DIAGNOSTIC-SANA
    ORIENT:
      purpose: Aava merkitsee retkirasiat.
      blocks:
        - type: explanatory_text
          content: Auta Aavaa merkitsemään rasiat. Ryhmä, numero ja sana kertovat saman määrän.
