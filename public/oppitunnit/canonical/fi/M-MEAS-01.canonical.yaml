schema_version: 0.1.0
kc_id: M-MEAS-01
catalog_version: STEM_KC_Catalogs_v0.2
metadata:
  title: Mittaaminen suureen vertaamisena sovittuun yksikköön
  subject: mathematics
  grade_band: 1-2
  mastery_role: atomic
  node_kind: procedure
  concept_path: [Matematiikka, Geometria ja mittaaminen, Mittaamisen periaate]
  source_basis: direct_curriculum
  curriculum_refs: [OPH-POPS2014-MATH-VL1-2-S3]
  prerequisite_snapshot:
    hard: [M-MEAS-00, M-NUM-01]
    strong: []
    helpful: []
teaching_model:
  learning_goal: >-
    Oppilas osaa mitata kuvattua suoraa pituutta vertaamalla sitä sovittuun
    yksikköön: rakentaa samanpituisista mittapaloista koko pituuden kattavan
    jonon ilman rakoja tai päällekkäisyyttä ja ilmoittaa tuloksen lukusanalla
    sekä käytetyllä yksiköllä. Tämä on laajemman mittaamisen periaatteen
    rajattu, kokonaisiin yksiköihin perustuva pituustoteutus.
  learner_facing_goal: >-
    Osaan selvittää suoran viivan pituuden sovitulla mittapalalla ja kertoa,
    montako sellaista mittapalaa siihen mahtuu.
  core_idea: >-
    Mittauksessa lasketaan, montako kertaa sovittu samanpituinen yksikkö
    kattaa mitattavan pituuden. Mittapalojen pitää alkaa viivan toisesta
    päästä, liittyä pää päähän ja päättyä toiseen päähän. Pelkkä irrallisten
    palojen lukumäärä ei vielä kerro pituutta. Mittaustulokseen kuuluu myös
    tieto käytetystä yksiköstä.
  success_evidence:
    - Rakentaa itse yhtenäisen peiton koko mitattavalle viivalle sovitun kokoisista yksiköistä.
    - Ei jätä välejä, peitä samaa kohtaa kahdesti eikä jatka viivan päiden ohi.
    - Ilmoittaa peittoa vastaavan lukusanan ja valitsee tehtävässä sovitun yksikön.
    - Tekee uuden mittauksen, kun yksikön pituus muuttuu mutta mitattava pituus säilyy.
    - Osoittaa saman keskeisen menettelyn myöhemmässä, vähintään vuorokauden jälkeen tehtävässä kertauksessa.
  boundaries:
    in_scope:
      - Idealisoitu suora pituus, joka peittyy kokonaan samanpituisilla kokonaisilla yksiköillä.
      - Positiivinen mittaustulos suomen lukusanoilla yhdestä kymmeneen; itsenäisissä tehtävissä sama pituus mitataan kahdella eripituisella yksiköllä ja tulokset eroavat.
      - Näkyvä mitattava viiva, erillinen sovittu mittapala ja oppilaan omat sijoitukset yhteisessä mittakaavassa.
      - Visuaalinen vertailu ja näppäimistöllä tehtävä sijoittelu; lukusanojen kuuntelu edellyttää toimivaa paikallista suomenkielistä ääntä.
    out_of_scope:
      - Muiden suureiden, kuten massan, tilavuuden, ajan tai pinta-alan, mittaamisen hallinnan osoittaminen.
      - Murto-osat, ylijäävä pituus, likiarvot, mittausepävarmuus ja fyysisten välineiden tarkkuus.
      - Viivaimen asteikon lukeminen, numeroiden tunnistaminen, koordinaattilaskenta tai yksikkömuunnokset oppimistavoitteena.
      - Lukusanan ääneen tuottamisen, ääntämisen, sujuvuuden tai kirjoittamisen arviointi.
      - Ei-visuaalisen oppimisen vastaavuus, koko saavutettavuuden tai WCAG-vaatimusten täyttymisen osoittaminen ja pilotointivalmius.
  prerequisite_assumptions:
    - kc_id: M-MEAS-00
      expected_level: Nykyinen itsenäisesti osoitettu suoran ominaisuusvertailun osaaminen vaaditaan ennen henkilökohtaista etenemistä.
    - kc_id: M-NUM-01
      expected_level: Nykyinen itsenäisesti osoitettu esineiden laskemisen yhdistetty osaaminen vaaditaan yhdessä M-MEAS-00:n kanssa; kumpikaan ei korvaa toista.
  conceptual_invariants:
    - Mitattava ominaisuus on tässä pituus, ei viivan sijainti tai väri.
    - Yksikkö säilyy samanpituisena yhden mittauksen kaikissa sijoituksissa.
    - Vierekkäiset yksiköt saavat jakaa päätepisteen, mutta eivät yhteistä pituusosuutta.
    - Koko mitattava pituus on peitettävä; oikea lukusana ei korvaa puutteellista peittoa.
    - Viivan siirtyminen ei muuta sen pituutta eikä sovitun yksikön pituutta.
    - Saman pituuden mittaluku voi muuttua, kun yksikön pituus vaihtuu; tuloksia tulkitaan yhdessä yksikön kanssa.
  likely_confusions: [M-MEAS-01-MIS-COVERAGE, M-MEAS-01-MIS-REPORT]
lesson_blueprint:
  entry_state: DIAGNOSTIC
  default_path:
    - DIAGNOSTIC
    - ORIENT
    - PREDICT
    - EXPLORE
    - EXPLAIN
    - GUIDED_PRACTICE
    - INDEPENDENT_PRACTICE
    - TRANSFER_CHECK
    - MASTERY_GATE
  fast_path:
    enabled: true
    diagnostic_requirement: Kaksi eri diagnostista tehtäväpohjaa oikein ilman tukea sekä measure_unit_iteration-näyttö; itsenäisen harjoittelun vaatimukset säilyvät.
    transfer_confirmation: required
  state_specs:
    DIAGNOSTIC:
      purpose: Selvitä ennen opastusta, yhdistyykö oppilaan rakentama yksikköpeitto ilmoitettuun mittaustulokseen kahdessa pituudessa.
      blocks:
        - type: question
          content:
            item_refs: [M-MEAS-01-DIAG-NAUHA, M-MEAS-01-DIAG-REUNA]
    ORIENT:
      purpose: Liitä tuttu suora vertailu sovittuun mittapalaan ja yhteisesti ymmärrettävään tulokseen.
      blocks:
        - type: explanatory_text
          content: {kind: enumeration_method_v1, method: unit_iteration, section: orient}
    PREDICT:
      purpose: Erota mittapalojen laskeminen mitattavan pituuden selvittämisestä ennen rakentamista.
      blocks:
        - type: reflection
          content: {kind: enumeration_method_v1, method: unit_iteration, section: predict}
    EXPLORE:
      purpose: Anna oppilaan rakentaa ja tarkastella omaa peittoa; harjoituksen onnistuminen on tuettua harjoittelua.
      blocks:
        - type: explanatory_text
          content: {kind: enumeration_method_v1, method: unit_iteration, section: guided}
        - type: question
          content:
            item_refs: [M-MEAS-01-GUIDED-PEITTO]
    EXPLAIN:
      purpose: Sanoita kokeilun jälkeen yhtenäinen yksikköpeitto sekä lukusanan ja yksikön yhteinen merkitys.
      blocks:
        - type: worked_example
          content: {kind: enumeration_example_v1, objective: unit_iteration, targetLength: 6, unitLength: 3}
        - type: explanatory_text
          content: {kind: enumeration_method_v1, method: unit_iteration, section: explain}
    GUIDED_PRACTICE:
      purpose: Yhdistä peiton rakentaminen erilliseen tulosilmoitukseen; pyydetty vihje ja harjoittelun tuki eivät ole itsenäistä näyttöä.
      blocks:
        - type: explanatory_text
          content: {kind: enumeration_method_v1, method: unit_iteration, section: guided}
        - type: question
          content:
            item_refs: [M-MEAS-01-GUIDED-TULOS]
    INDEPENDENT_PRACTICE:
      purpose: Kerää vähintään kolme tuetonta kokonaista mittausta vähintään kahdesta tehtäväpohjasta; pelkkä ilmoitus ei kelpaa näytöksi.
      blocks:
        - type: question
          content:
            item_refs: [M-MEAS-01-INDEP-NAUHA, M-MEAS-01-INDEP-REUNA]
    TRANSFER_CHECK:
      purpose: Mittaa samanpituinen viiva aidosti eripituisella sovitulla yksiköllä samassa koordinaattikehyksessä; uusi nimi ei yksin ole siirtovaikutusta.
      blocks:
        - type: question
          content:
            item_refs: [M-MEAS-01-TRANSFER-UUSI-YKSIKKO]
    MASTERY_GATE:
      purpose: Tee näkyväksi mittaamisen perustelu; pohdintaa ei pisteytetä eikä käytetä korvaamaan itsenäistä rakentamisnäyttöä.
      blocks:
        - type: reflection
          content: >-
            Miten voisit näyttää ystävälle, että mittauksesi peittää koko
            viivan? Miksi tuloksesta pitää kertoa myös yksikkö? Mitä voi
            muuttua tuloksessa, jos sama viiva mitataan pidemmällä palalla?
            Voit vastata ääneen; pohdinta ei ole uusi arvioitava tehtävä.
assessment_blueprint:
  diagnostic:
    localized_child_repairs: {}
    minimum_templates: 2
    fast_path_confirmation_tags: [measure_unit_iteration]
    execution_policy: Fast path skips teaching and guided work; independent minima and coverage remain required.
    pass_rule: Kaksi eri diagnostista pohjaa oikein ilman tukea; molemmissa peitto ja tulos arvioidaan yhdessä.
  independent:
    minimum_successes: 3
    template_diversity: 2
    max_supported_attempts_counted: 0
    required_tags: [measure_unit_iteration]
  transfer:
    required: true
    minimum_successes: 1
    novel_context_required: true
  delayed:
    required: true
    minimum_successes: 2
    minimum_delay_hours: 24
    reuse_templates: [M-MEAS-01-INDEP-NAUHA]
    required_tags: [measure_unit_iteration]
    required_contexts: [Kertaus — suoran viivan mittaaminen, Suoran nauhan pituus]
    earliest_delay_policy: >-
      Aikaisintaan vuorokausi koko hankintanäytön täyttymisen jälkeen,
      uudessa istunnossa tai välissä suoritetun toisen osaamiskohteen jälkeen.
      Alkuperäinen kertauspohja ja uudelleen käytettävä itsenäinen ydinpohja
      kattavat molemmat koko mittausmenettelyn ilman tukea.
  supported_evidence:
    counts_as_mastery: false
  misconception_clearance:
    - misconception_id: M-MEAS-01-MIS-COVERAGE
      evidence_tags: [measure_unit_iteration]
      rule: Myöhempi tueton kokonainen mittaus osoittaa onnistuneen menettelyn; se ei todista aiemman virheen syytä.
    - misconception_id: M-MEAS-01-MIS-REPORT
      evidence_tags: [measure_unit_iteration]
      rule: Myöhempi tueton mittaus sisältää sekä hyväksyttävän peiton että sitä vastaavan lukusanan ja yksikön.
