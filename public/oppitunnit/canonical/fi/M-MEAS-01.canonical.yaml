      Havaittu yksikköpeitto ei täytä mallin ehtoja. Mukana voi olla rako,
      päällekkäinen osa, puuttuva tai ylimääräinen pala taikka sijoitus viivan
      päiden ulkopuolella. Havainto ei yksilöi virheen syytä eikä todista
      puuttuvaa lapsitaitoa.
    evidence_patterns:
