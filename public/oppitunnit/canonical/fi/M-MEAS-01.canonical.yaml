        when: 'observed:unit_coverage'
    feedback_strategy:
      conceptual_prompt: Mitä viivan osia omat mittapalasi peittävät? Tarkista koko pituus ja palojen liittymiskohdat.
      representation: Säilytä oppilaan omat sijoitukset tarkasteltavina; älä anna valmista peittoa.
    repair_targets: [M-MEAS-01]
    status: hypothesis
  - id: M-MEAS-01-MIS-REPORT
    description: >-
      Mittaustuloksen lukusana tai yksikkö puuttuu tai ei vastaa tämän mallin
      oikeaa mittausta. Havainto ei yksin erota laskemisvirhettä, valintavirhettä
      tai yksikön merkityksen epäselvyyttä.
    evidence_patterns:
      - kind: interaction_pattern
        when: 'observed:unit_report'
    feedback_strategy:
      conceptual_prompt: Mitä lukusana kertoo ja millä mittapalalla mittasit? Vertaa ilmoitustasi omaan mittaukseesi.
      representation: Pidä lukusana ja yksikkö oppilaan erillisinä valintoina; älä täytä kumpaakaan valmiiksi.
    repair_targets: [M-MEAS-01]
    status: hypothesis
differentiation:
  support_variants:
    learner_prompt: Tarkastellaan ensin viivan päitä, sitten palojen liittymiskohtia ja lopuksi tuloksen lukusanaa sekä yksikköä.
    step_chunking: Tarkastelukohteet voi käydä läpi yksi kerrallaan oppilaan omista sijoituksista; oikeita paikkoja ei aseteta puolesta.
    hint_availability: Pyydettävät vihjeet ohjaavat tarkistamaan peittoa ja ilmoitusta; vihjealtistus säilyy tuettuna näyttönä.
    worked_example_depth: Tyypitetty kuuden pituisen viivan ja kolmen pituisen yksikön esimerkki näyttää kaksi mittapalaa; sen tarkat arvot sitoutuvat samaan esitykseen ja paljastusmerkintään.
    reduced_motion: Mittaaminen ei vaadi liikkuvan esityksen seuraamista tai nopeaa toimintaa.
    access_scope: >-
      Näkyvä geometria ja näppäimistösijoittelu ovat rajattu tarkasteltu reitti.
      Lukusanoja voi kuunnella toimivalla paikallisella suomenkielisellä äänellä.
      Tämä ei tarkoita koko oppitunnin ääneen lukemista. Sijaintien tekstitiedot
      voivat vaatia numeroita ja laskemista; niiden ei väitetä tarjoavan
      vastaavaa ei-visuaalista oppimisreittiä.
  challenge_variants:
    learner_block:
      type: reflection
      content: {kind: enumeration_method_v1, method: unit_iteration, section: challenge}
    reduced_scaffolding: Ei tarkistusvaiheita tai vihjeitä valmiina itsenäisessä tehtävässä; sama tavoite ja vapaa sijoittelu säilyvät.
    multi_step_reasoning: Vertaa yksikön valintaa ja sen vaikutusta palojen määrään saman pituuden mittauksessa; haaste ei perustu suurempiin lukuihin.
    transfer_novelty: Aito yksikön pituuden muutos samassa kiinteässä kohteessa; kontekstin nimeäminen ei riitä.
    acceleration_probe: Kaksi tuetonta diagnostista onnistumista voi ohittaa opetuksen, mutta itsenäisen näytön ja siirron vaatimukset säilyvät.
