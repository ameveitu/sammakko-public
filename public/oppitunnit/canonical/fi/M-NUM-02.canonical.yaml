      conceptual_prompt: "Palaa omaan laskentaasi: mitä teit esineiden ja sanojen kanssa? Tarvittaessa voit muokata
        laskujonoasi ja tehdä vahvistuksen sekä järjestyksen vaihdon uudelleen."
      interpretation_limit: Havaintokoodi on rajattu tuotoksen tai toimintoketjun poikkeama. Selitys oppilaan
        ajattelusta on hypoteesi; yhdestä vastauksesta ei tehdä lapsikohtaista diagnoosia.
    repair_targets: []
    status: hypothesis
