differentiation:
  support_variants:
    step_chunking: Ohjatussa harjoittelussa erotellaan kohteen valinta, sanan valinta ja oman kohdistuksen
      tarkastelu. Itsenäisen tehtävän kohdemääräaluetta tai onnistumisehtoa ei madalleta.
    hint_availability: Ensimmäisessä ohjatussa tehtävässä tehdään yksi kohdistus yhdessä ennen oppijan jatkoa. Toisessa
      ohjatussa tehtävässä tätä aloitusta ei anneta. Vihjeet ja virhepalaute saavat näyttää tarvittavan
      osavaiheen tai analogisen mallin; apu kirjataan ennen näyttämistä eikä tuota itsenäistä näyttöä.
    text_density: Lyhyt toimintaohje; suomenkieliset lukusanat voidaan kuunnella erikseen paikallisena toistona.
      Muu oppituntiteksti ei ole luvattu kuunneltavaksi.
    alternate_representation: Tunnistettavat merkit sekä nykyiset valinta- ja näppäimistötoiminnot. Sanapankki on
      kaikissa tehtävissä kokonainen ja sekoitettu.
    reduced_motion: Kohdistus ei vaadi liikkuvan esineen seuraamista. Nykyinen vähennetyn liikkeen tuki säilyttää
      saman tavoitteen.
  challenge_variants:
    reduced_scaffolding: Sama predikaatti ilman ohjattua harjoittelua; ei uusia oikeellisuusehtoja tai sanojen
      järjestysvaatimusta.
    transfer_novelty: Rivi vaihtuu hajanaiseksi asetteluksi samalla kolmesta kahdeksaan ulottuvalla
      kohdemääräalueella. Uusi nimi tai siemen ei yksin ole siirto.
    acceleration_probe: Kaksi itsenäistä diagnostista pohjaa sallii nopean etenemisen; itsenäinen vähimmäisnäyttö
      ja siirto ovat silti pakolliset.
    learner_block:
      type: reflection
      content:
        kind: enumeration_counting_method_v1
        section: challenge
