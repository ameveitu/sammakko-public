  delayed:
    required: true
    minimum_successes: 4
    minimum_delay_hours: 24
    required_tags:
      - attribute_shape_same
      - attribute_shape_different
      - attribute_size_same
      - attribute_size_different
    required_contexts: []
    earliest_delay_policy: "Vähintään 24 tuntia hankinnan jälkeen: uusi tueton vastaus jokaiseen vaadittuun
      havaintoluokkaan. Ajan kuluminen tai mallin katsominen ei ole näyttöä."
  supported_evidence:
    counts_as_mastery: false
  misconception_clearance:
    - misconception_id: M-TH-01-OBS-SUHDE
      evidence_tags:
        - attribute_shape_same
        - attribute_shape_different
        - attribute_size_same
        - attribute_size_different
      rule: Uudet tuettomat onnistumiset kaikista nimetyistä havaintoluokista. Virhehavainnon ajonaikainen
        sidonta on vielä toteutettava; tästä tekstistä ei myönnetä poistumista.
    - misconception_id: M-TH-01-OBS-KORJAUSKOHDE
      evidence_tags:
        - attribute_repair_shape_same
        - attribute_repair_size_different
      rule: Uudet tuettomat ja aidosti novel-soveltamispäätökset molemmista rajatuista parikorjaustapauksista.
        Väärään pariin osunut oikea korvaaja tai yhden tapauksen toisto ei riitä.
