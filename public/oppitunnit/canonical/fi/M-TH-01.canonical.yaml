misconceptions:
  - id: M-TH-01-OBS-SUHDE
    description: Vahvistettu valinta ei täytä ominaisuus/sama-eri-sääntöä. Väriin, paikkaan tai kokoon
      tukeutuminen on tutkittava vaihtoehtoinen selitys, ei lapsidiagnoosi.
    evidence_patterns:
      - kind: committed_relation_error
        when: Domain palauttaa comparison-virheen vahvistetusta valinnasta. Tyhjä tai vahvistamaton tila ei ole
          sama havainto.
    feedback_strategy:
      conceptual_prompt: Verrataan vielä ohjeen ominaisuutta malliin. Pelkkä sama väri tai tuttu paikka ei ratkaise.
      representation: Pyydettäessä näytettävä ominaisuuden vertailumalli on tukea.
    repair_targets:
      - M-TH-01
    status: hypothesis
  - id: M-TH-01-OBS-KORJAUSKOHDE
    description: Vahvistettu parikorjaus kohdistuu jo kelvolliseen pariin; alkuperäinen sääntöä rikkova pari
      jää korjaamatta. Havainto kuvaa valittua kohdetta, ei lapsen tarkkaavuutta tai diagnoosia.
    evidence_patterns:
      - kind: committed_wrong_pair
        when: Domain palauttaa wrong_pair-virheen. Pelkkä tyhjä tai vahvistamaton tila ei ole tämä havainto.
    feedback_strategy:
      conceptual_prompt: Tarkistetaan ensin molemmat parit näkyvän säännön mukaan. Valitse se pari, jossa
        kumppani ei täytä sääntöä. Korvaava merkki kuuluu juuri siihen pariin.
      representation: Pyydettäessä näytettävä viallisen parin vertailu on tukea eikä seuraava sama vastaus
        muutu itsenäiseksi.
    repair_targets:
      - M-TH-01
    status: hypothesis
differentiation:
  support_variants:
    one_decision: Yksi malli, kolme vaihtoehtoa ja lyhyt sääntö yhdessä työtilassa. Suuret kohteet; valintaa
      saa vaihtaa ennen vahvistusta.
    fading: Ohjauksessa reunan vertailu ja Aavan perustelu; häivytyksessä ne poistuvat. purpose:guided ei
      yksin kirjaa käytettyä apua.
    support_boundary: Adapteri hyväksyy vain assistance:none. Opetustuki ja sen altistuskirjaus tarvitsevat
      sidonnan; älä lisää korostuskenttää tai kuittaa tukea itsenäiseksi.
    access: Ääriviivat erottavat muodot. Valinnainen kielituki ei vaadi kuulemisen kuittausta. Ei väitettä
      ei-visuaalisesta vastaavuudesta.
  challenge_variants:
    learner_prompt: Loikka sanoo, että parit ovat kunnossa, koska merkit ovat samanvärisiä. Tarkista ne Aavan
      näkyvän muoto- tai kokokriteerin mukaan ja korjaa sääntöä rikkova pari.
    harder_reasoning: Paikannus ja korvaajan valinta ovat kaksi eri päätöstä. Suurempia lukuja tai muotojen
      nimien tuottamista ei tarvita.
    capability_boundary: Parikorjaus käyttää nyt toteutettua repair_attribute_pair-operaatiota; varsinaiset
      mallin, tuen, altistuksen, rendererin ja journey-kompilaation sidonnat kuuluvat mainille. Ei
      hidden-rule-luokittelua tai kaikkien neljän korjausyhdistelmän väitettä.
