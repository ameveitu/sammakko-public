schema_version: 0.1.0
kc_id: M-TH-01
catalog_version: STEM_KC_Catalogs_v0.2
metadata:
  title: Yhtäläisyyksien ja erojen havaitseminen
  subject: mathematics
  grade_band: 1-6
  mastery_role: atomic
  node_kind: foundation
  concept_path:
    - Matematiikka
    - Ajattelun taidot
    - Vertailu
  source_basis: direct_curriculum
  curriculum_refs:
    - OPH-POPS2014-MATH-VL1-2-S1
    - OPH-POPS2014-MATH-VL3-6-S1
  prerequisite_snapshot:
    hard: []
    strong: []
    helpful: []
teaching_model:
  learning_goal: "Oppilas havaitsee yhtäläisyyden tai eron annetun muoto- tai kokokriteerin mukaan. Ydin
    kattaa kaikki neljä muoto/koko × sama/eri -yhdistelmää. Rajattu sovellus paikantaa kahdesta parista
    sääntöä rikkovan ja korjaa sen valitsemalla kumppanin kolmesta: muoto–sama sekä koko–eri.
    Atomic/foundation-rooli ja esitiedoton juuri säilyvät. Ei vapaan luokittelun tai yleisen
    päättelytaidon väitettä."
  learner_facing_goal: Löydän merkin sen ominaisuuden mukaan, jota nyt tarvitaan.
  core_idea: Pyydetty ominaisuus ratkaisee. Sama väri ei takaa samaa muotoa, eikä sama muoto takaa samaa kokoa.
  success_evidence:
    - "Tueton oma valinta jokaisesta neljästä yhdistelmästä: muoto–sama, muoto–eri, koko–sama ja
      koko–eri. Neljä onnistumista ja neljä pohjaa ovat tässä vähimmäisprojektiraja, eivät
      tutkimusvakio."
    - "Kaksi omaa tuetonta soveltamishavaintoa: muoto–sama- ja koko–eri-parikorjaus. Molemmat
      edellyttävät oikeaa virheparia ja korvaajaa. Näyttö ei kata kaikkia neljää parikorjausyhdistelmää;
      pyydetty apu tai tuettu korjaus ei täytä sitä."
    - Myöhempi neljän päätöksen näyte sisältää muoto/koko ja sama/eri. Yksi virhe ei selitä väärän
      strategian syytä.
  boundaries:
    in_scope:
      - Yksi nimetty ominaisuus kerrallaan. Muotoina ympyrä, neliö ja kolmio; koko on saman perusmuodon
        tasainen suurennos.
      - Väri on häiriötekijä, ei ainoa ratkaiseva tai välittävä vihje.
      - Rajattu sovellus paikantaa yhden sääntöä rikkovan parin kahdesta ja valitsee sille korvaavan
        merkin kolmesta. Toteutettu domain-operaatio ei vielä hyväksy journeyä, oppimistulosta tai
        julkaisua.
    out_of_scope:
      - Muotojen nimeäminen, piirtäminen, vapaa luokittelusäännön löytäminen tai yleisen ajattelukyvyn
        arvio.
      - Eri muotoisten pinta-alojen, massojen tai korkeuksien vertailu. Ei piilotettua
        numerotaitovaatimusta.
      - Pelkästä tarinan, värin tai paikan vaihtumisesta päätelty yleinen siirtovaikutus.
      - "Kaikkien neljän yhdistelmän parikorjaushallinta: siirtonäyte kattaa vain muoto–sama ja koko–eri.
        Täysi tuotantoreitti odottaa mainin integraatiota."
  prerequisite_assumptions: []
  conceptual_invariants:
    - "Jäädytetty juurisolmu: ei vaadittuja esitietoja eikä M-MEAS-00:n tai muotojen nimien piilotettua
      testiä."
    - Sääntö jää näkyviin myös itsenäisessä tehtävässä. Sen poistaminen vaihtaisi tavoitetta.
    - Oppija tuottaa vaihtoehtovalinnan. Järjestelmä antaa säännön ja kohteet, mutta ei oikeaa valintaa.
  likely_confusions:
    - M-TH-01-OBS-SUHDE
lesson_blueprint:
  entry_state: DIAGNOSTIC
  default_path:
