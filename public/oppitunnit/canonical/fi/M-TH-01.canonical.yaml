  state_specs:
    DIAGNOSTIC:
      purpose: Kaksi havaintoa annetusta muotosäännöstä; puuttuva havainto avaa mallin, ei diagnoosia.
      blocks:
        - type: question
          content:
            item_refs:
              - M-TH-01-DIAG-SAMA
              - M-TH-01-DIAG-ERI
    ORIENT:
      purpose: Aava valmistelee Loikan reittitaulun merkkejä. Tarvitaan pyydetyn muodon ja koon mukaisia
        samanlaisia ja erilaisia merkkejä.
      blocks:
        - type: explanatory_text
          content: Autetaan Aavaa tarkistamaan merkit. Katso ohjeesta, verrataanko muotoa vai kokoa ja etsitäänkö
            samaa vai eriä.
    WORKED_EXAMPLE:
      purpose: Näytä kaikki neljä kriteeriä alkuperäisillä esimerkeillä. Muoto ja koko ovat molemmat ydintä,
        eivät toistensa siirtotehtäviä.
      blocks:
        - type: worked_example
          content:
            givens:
              kind: attribute_comparison_task_v1
              context: Aavan samanmuotoinen jatkomerkki
              operator: select_attribute
              attribute: shape
              relation: same
              reference:
                id: reference
                shape: circle
                size: 2
                colour: blue
                geometry:
                  kind: circle
                  cx: 6
                  cy: 6
                  r: 6
              candidates:
                - id: choice-1
                  shape: circle
                  size: 3
                  colour: blue
                  geometry:
                    kind: circle
                    cx: 6
                    cy: 6
                    r: 6
                - id: choice-2
                  shape: square
                  size: 2
                  colour: blue
                  geometry:
                    kind: rect
                    x: 0
                    y: 0
                    width: 12
                    height: 12
                - id: choice-3
                  shape: triangle
                  size: 4
                  colour: plum
                  geometry:
                    kind: polygon
                    points:
                      - - 6
                        - 0
                      - - 12
                        - 12
                      - - 0
                        - 12
            steps:
              - Mallissa on pieni sininen ympyrä. Vaihtoehtoina ovat suurempi sininen ympyrä, sininen
                neliö ja luumunvärinen kolmio.
              - Aava seuraa reunaa. Ympyrä on edelleen samaa muotoa, vaikka koko vaihtuu.
            conclusion: Aava valitsee suuremman ympyrän; samanvärinen neliö ei täytä muotosääntöä.
            implementation_boundary: Alkuperäiset työvaiheet ja tarkat domain-givens vastaavat tämän draftin
              attribute_examples_v1-mallin core-esimerkkejä. Helperin matemaattinen validointi ei hyväksy
              rendererin, tuen tai altistuksen normaalia reittiä; ne ja sisältöarvio kuuluvat mainin
              integraatioon.
        - type: worked_example
          content:
            givens:
              kind: attribute_comparison_task_v1
              context: Aavan erimuotoinen varoitusmerkki
              operator: select_attribute
              attribute: shape
              relation: different
              reference:
                id: reference
                shape: circle
                size: 2
                colour: blue
                geometry:
                  kind: circle
                  cx: 6
                  cy: 6
                  r: 6
              candidates:
                - id: choice-1
                  shape: square
                  size: 3
                  colour: blue
                  geometry:
                    kind: rect
                    x: 0
                    y: 0
                    width: 12
                    height: 12
                - id: choice-2
                  shape: circle
                  size: 2
                  colour: blue
                  geometry:
                    kind: circle
                    cx: 6
                    cy: 6
                    r: 6
                - id: choice-3
                  shape: circle
                  size: 4
                  colour: plum
                  geometry:
                    kind: circle
                    cx: 6
                    cy: 6
                    r: 6
            steps:
              - Malli on pieni sininen ympyrä. Valittavana on suurempi neliö sekä kaksi ympyrää.
              - Nyt pyydetään eri muotoa. Aava vertaa reunaa eikä vain toista edellistä ympyrävalintaa.
            conclusion: Neliö on eri muotoa. Sama ja eri johtavat tässä eri valintaan.
            implementation_boundary: Alkuperäiset työvaiheet ja tarkat domain-givens vastaavat tämän draftin
              attribute_examples_v1-mallin core-esimerkkejä. Helperin matemaattinen validointi ei hyväksy
              rendererin, tuen tai altistuksen normaalia reittiä; ne ja sisältöarvio kuuluvat mainin
              integraatioon.
        - type: worked_example
          content:
            givens:
              kind: attribute_comparison_task_v1
              context: Aavan merkin koon vertailumalli
              operator: select_attribute
              attribute: size
              relation: same
              reference:
                id: reference
                shape: circle
                size: 2
                colour: blue
                geometry:
                  kind: circle
                  cx: 6
                  cy: 6
                  r: 6
              candidates:
                - id: choice-1
                  shape: circle
                  size: 2
                  colour: blue
                  geometry:
                    kind: circle
                    cx: 6
                    cy: 6
                    r: 6
                - id: choice-2
                  shape: circle
                  size: 3
                  colour: blue
                  geometry:
                    kind: circle
                    cx: 6
                    cy: 6
                    r: 6
                - id: choice-3
                  shape: circle
                  size: 4
                  colour: plum
                  geometry:
                    kind: circle
                    cx: 6
                    cy: 6
                    r: 6
            steps:
              - Aavan malli on pieni ympyrä. Kaikki vaihtoehdot ovat ympyröitä, joten muoto ei ratkaise
                tätä kertaa.
              - "Aava vertaa kokoja ja valitsee yhtä suuren ympyrän. Pelkkä sama väri ei riitä: myös
                toinen, suurempi vaihtoehto on samanvärinen."
            conclusion: Samankokoinen merkki sopii mallin kokoiseen paikkaan. Suurempi samanmuotoinen merkki ei täytä
              kokokriteeriä.
            implementation_boundary: Alkuperäiset työvaiheet ja tarkat domain-givens vastaavat tämän draftin
              attribute_examples_v1-mallin core-esimerkkejä. Helperin matemaattinen validointi ei hyväksy
              rendererin, tuen tai altistuksen normaalia reittiä; ne ja sisältöarvio kuuluvat mainin
              integraatioon.
        - type: worked_example
          content:
            givens:
              kind: attribute_comparison_task_v1
              context: Aavan merkin koon vertailumalli
              operator: select_attribute
              attribute: size
              relation: different
              reference:
                id: reference
                shape: circle
                size: 4
                colour: blue
                geometry:
                  kind: circle
                  cx: 6
                  cy: 6
                  r: 6
              candidates:
                - id: choice-1
                  shape: circle
                  size: 2
                  colour: blue
                  geometry:
                    kind: circle
                    cx: 6
                    cy: 6
                    r: 6
                - id: choice-2
                  shape: circle
                  size: 4
                  colour: blue
                  geometry:
                    kind: circle
                    cx: 6
                    cy: 6
                    r: 6
                - id: choice-3
                  shape: circle
                  size: 4
                  colour: plum
                  geometry:
                    kind: circle
                    cx: 6
                    cy: 6
                    r: 6
            steps:
              - Aavan malli on suuri ympyrä. Vaihtoehtoina on pieni ympyrä ja kaksi mallin kokoista
                ympyrää.
              - Nyt etsitään eri kokoa. Aava valitsee pienemmän; pelkkä suurimman merkin valinta olisi
                väärin.
              - Toisessa harjoituksessa eri kokoinen voi olla suurempi. Eri ei tarkoita aina pientä tai
                aina suurta.
            conclusion: "Eri koko vertaa malliin: pienempikin voi olla oikea. Väri saa vaihdella."
            implementation_boundary: Alkuperäiset työvaiheet ja tarkat domain-givens vastaavat tämän draftin
