              rendererin, tuen tai altistuksen normaalia reittiä; ne ja sisältöarvio kuuluvat mainin
              integraatioon.
    GUIDED_PRACTICE:
      purpose: Harjoittele kaikkia neljää kriteeriä. Apu ohjaa relevanttiin ominaisuuteen eikä vaihda
        tavoitetta nimeämiseksi.
      blocks:
        - type: explanatory_text
          content: "Aava näyttää ensin ohjeen: muoto vai koko? Sama vai eri? Katso sitten vertailumerkkiä."
        - type: explanatory_text
          content: "Muototehtävässä seuraa reunaa ja tarkista jokainen vaihtoehto. Kokotehtävässä muoto on sama:
            vertaa, onko merkki mallin kokoinen, pienempi vai suurempi. Valitse vasta sitten."
        - type: explanatory_text
          content: Saat pyytää Aavan mallin tai vertailukorostuksen ennen virhettä. Avun jälkeen tämä vastaus on
            harjoittelua.
        - type: question
          content:
            item_refs:
              - M-TH-01-GUIDE-SAMA
              - M-TH-01-GUIDE-ERI
              - M-TH-01-GUIDE-KOKO-SAMA
              - M-TH-01-GUIDE-KOKO-ERI
    FADED_EXAMPLE:
      purpose: Poista ratkaisunuoli, Aavan valinta ja vastauslause kaikissa neljässä kriteerissä. Sääntö ja
        vertailumerkki säilyvät.
      blocks:
        - type: explanatory_text
          content: Nyt valitset itse. Ohje ja vertailumerkki jäävät näkyviin; Aavan ratkaisu poistuu. Saat silti
            pyytää apua.
        - type: question
          content:
            item_refs:
              - M-TH-01-FADE-SAMA
              - M-TH-01-FADE-ERI
              - M-TH-01-FADE-KOKO-SAMA
              - M-TH-01-FADE-KOKO-ERI
    INDEPENDENT_PRACTICE:
      purpose: Oma valinta ja vahvistus ilman reunakorostusta, ratkaisuesimerkkiä tai automaattista korjausta.
      blocks:
        - type: question
          content:
            item_refs:
              - M-TH-01-CORE-SAMA
              - M-TH-01-CORE-ERI
              - M-TH-01-CORE-KOKO-SAMA
              - M-TH-01-CORE-KOKO-ERI
    TRANSFER_CHECK:
      purpose: Aava tarkistaa valmiiksi tehdyt merkkiparit. Pelkän yhden merkin vastaavuuden sijaan oppija
        paikantaa virheen ja korjaa juuri sen kahdessa rajatussa tapauksessa.
      blocks:
        - type: explanatory_text
          content: Aavan merkkipareissa on korjattavaa. Katso näkyvä sääntö, valitse sitä rikkova pari ja sille
            uusi kumppani. Voit muuttaa valintoja ennen Valmis-painiketta.
        - type: question
          content:
            item_refs:
              - M-TH-01-APP-KORJAA-MUOTO-SAMA
              - M-TH-01-APP-KORJAA-KOKO-ERI
    MASTERY_GATE:
      purpose: Seuraus koskee tarkistettua merkkipäätöstä. Tuettu reitti voi edistää tarinaa ilman
        hallintahyvitystä.
      blocks:
        - type: explanatory_text
          content: Aava voi jatkaa reittitaulun merkkien järjestämistä Loikan kanssa.
    DELAYED_REVIEW:
      purpose: "Uuden retken neljä tuetonta päätöstä: molemmat ominaisuudet ja suhteet; ei kaikkien tilanteiden
        säilymisnäyttö."
      blocks:
        - type: question
          content:
            item_refs:
              - M-TH-01-LATER-1
              - M-TH-01-LATER-2
              - M-TH-01-LATER-3
              - M-TH-01-LATER-4
assessment_blueprint:
  diagnostic:
