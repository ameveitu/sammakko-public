misconceptions:
  - id: SCI-ENV-OBSERVE-01-OBS-RISTIRIITA
    description: Vahvistettu lause on ristiriidassa nimenomaisesti esitettyjen kuvafaktojen kanssa. Ei lapsen
      havaintokyvyn tai lukutaidon diagnoosia.
    evidence_patterns:
      - kind: observed_contradicted
        when: Kelvollinen vahvistettu valinta saa domainilta contradicted-virheen, ei tyhjänä tai
          vahvistamattomana.
    feedback_strategy:
      conceptual_prompt: Katsotaan kuvaa uudelleen. Tarkista pallon ja merkin paikat tai näkyykö pallo tässä
        kuvassa. Valittu lause ei vielä vastaa kuvan näyttämää asiaa.
      representation: Pyydettävä Aavan vertailumalli on tukea.
    repair_targets:
      - SCI-ENV-OBSERVE-01
    status: hypothesis
  - id: SCI-ENV-OBSERVE-01-OBS-SYY
    description: Valinta lisää tuulen syyksi, jota kuvat eivät tue eivätkä kumoa. Ei yleistä lapsen
      syypäättelydiagnoosia.
    evidence_patterns:
      - kind: observed_unsupported
        when: Kelvollinen vahvistettu valinta saa domainilta unsupported-virheen.
    feedback_strategy:
      conceptual_prompt: Tuuli voi olla mahdollinen selitys, mutta kuva ei kerro syytä. Valitse asia, jonka
        voit tarkistaa kuvasta.
      representation: Aineiston tarkistava malli on tukea eikä muuta syyväitettä epätodeksi.
    repair_targets:
      - SCI-ENV-OBSERVE-01
    status: hypothesis
differentiation:
  support_variants:
    step_chunking: Yksi kuva tai rinnakkainen kuvapari ja kolme lyhyttä suurta korttia samassa työalueessa.
      Kohdenimet ja suuntasanat opetetaan paikallisesti.
    hints: Apua saa ennen virhettä. Malli, ACK ja vihje säilyvät apuhistoriassa; sama paljastettu vastaus ei
      ole uusi tueton näyttö.
    fading: Ratkaisukorostus, Aavan valinta ja johtopäätös poistuvat. Kuva, nimet ja lyhyt ohje jäävät.
    access: Näppäimistö ja pysäytyskuvat/reduced motion. Ääni valinnainen ja aluksi pois; ei kuulokuittausta
      tai suullisen tuoton väitettä. Vastauksen antava alt-teksti on arvioitavan tiedon tukea. Ei
      valmista ei-visuaalisen reitin vastaavuutta.
  challenge_variants:
    learner_prompt: "Loikka arvelee: pallo on eri värinen, joten se vaihtoi paikkaa. Aava vertaa paikkoja
      samaan merkkiin. Voiko väri vaihtua paikan säilyessä?"
    harder_reasoning: Paikka voi vaihtua myös samalla merkkipuolella. Samat näytetyt paikat eivät todista
      jatkuvaa liikkumattomuutta. Ei suurempia lukuja, selityslomaketta tai yleisen tieteellisen
      selityksen arviointia.
