  - id: PROJECT-ENUMERATION-v0.1
    type: project_formalization
    title: Bounded enumeration and equal-unit predicates
    publisher: Sammakko
    status: project_design
    notes: >-
      ADR-0009 defines represented Finnish tokens, finite object assignment,
      ordered sequences, cardinal member reporting and exact equal-unit coverage.
      These deterministic project models have scoped capability review; they
      are not an empirical efficacy claim or independent approval of new packs.
    locator: DECISIONS/ADR-0009-enumeration-capability.md
  - id: PROJECT-BATCH01-POLICY-v0.1
    type: project_policy
    title: Batch-01 evidence and progression design
    publisher: Sammakko
    status: project_design
    notes: >-
      Authored success/diversity thresholds, diagnostic confirmations, transfer
      proxies, 24-hour minimum retention interval, represented number bounds and
      mode decisions are project design choices. No cited study establishes
      these exact constants. Misconception explanations remain hypotheses.
    locator: PRODUCTION_PLAN.md
