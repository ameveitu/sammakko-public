    supported_claim: Äärellinen saman arvon vastaavuus molemmissa suunnissa,
      vahvistettu oma valinta, todellinen eri arvoisen alkuparin korjaus, koko
      vaaditun faktajoukon kaksisuuntainen mallikansi ja muuttumaton raakaa apua
      säilyttävä oppimishistoria. Process-rooli, sanallinen pääsy,
      case-kattavuus ja 3/2/4/24h-kynnykset ovat projektin sopimuksia.
    limits: Ei empiirinen vaikuttavuustutkimus, itsenäinen hyväksyntä näille
      kahdelle pack-draftille tai lupa ihmiskokeeseen/julkaisuun. Mallin
      toimitus, tuettu vastaus ja closure eivät myönnä myönteistä
      taitoevidenssiä. Viivästetty neljän tapauksen näyte ei todista kaikkien
      faktojen säilymistä.
    primary_guidance_reused:
      - source: R01
        url: https://ies.ed.gov/ncee/wwc/PracticeGuide/26
        reviewed: 2026-10-26 HTML recommendations 1–3, as bound in source_report
        node_mapping:
          M-NUM-WORD-NUMERAL: Näkyvä sana–merkintä-parimalli, lyhyt kieli ja tuen
            vähentäminen ennen omaa valintaa.
          M-NUM-QTY-WORD: Koko ryhmän ja sanan parimalli sekä oma tarkistus ilman
            tarjottua numerovälivastausta.
        limits: K–6-tuen käytäntöopas; ei näiden digitaalisten tehtävien tai tarkkojen
          kynnysten validointi. PDF-menetelmiä ei väitetä luetuiksi.
      - source: R02
        url: https://www.ncetm.org.uk/classroom-resources/ey-cardinality-and-counting/
        reviewed: 2026-10-26 HTML introduction, counting/tagging, last number, Numeral
          meanings and Conservation, as bound in source_report
        node_mapping:
          M-NUM-WORD-NUMERAL: Vain merkintöjen esitysten rinnakkainen opetussuunnittelun
            tuki; sana–merkintä-alueen normiviite on OPH.
          M-NUM-QTY-WORD: Koko määrän sanallinen merkitys ja asettelun erottaminen
            määrästä; ei Give-N:n lisäämistä tähän sopimukseen.
        limits: Alkuperäinen opetusresurssi, ei sovelluksen vaikutuskoe; ei spontaanin
          suullisen tuotannon validointi.
