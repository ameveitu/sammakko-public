catalog:
  id: Physics_KC_Catalog_7_9_v0.2
  version: '0.2'
  status: pre-MVP refactored candidate baseline
  scope: Suomen perusopetuksen fysiikka 7–9, esitietoina ympäristöopin 1–6 fysiikan ja luonnontieteellisen tutkimisen alkutiedot
  language: fi
  time_locked_note: Voimassa olevan POPS 2014 -rakenteen pohjalta tehty pedagoginen DAG; ei OPH:n määräämä vuosiluokkajärjestys.
    POPS 2027/2028 -uudistus ei ole vielä tämän version normatiivinen lähde.
  external_prerequisite_catalogs:
  - Science_KC_Foundation_1_6_v0.2
  - Math_KC_Catalog_1_6_v0.4
  - Math_KC_Catalog_7_9_v0.2
  prerequisite_semantics:
    required: Aidosti välttämätön ydinesitieto useimmille ydintehtäville.
    strong: Vahva tuki; voidaan korjata rinnalla tai ohittaa vaihtoehtoisella representaatiolla.
    helpful: Hyödyllinen, ei avausportti.
  group_semantics:
    all_of: kaikki vaaditaan
    any_of: vähintään yksi riittää
    between_groups: ryhmät yhdistyvät AND-logiikalla
  source_basis_semantics:
    direct_curriculum: suoraan normatiivisen sisältöalueen nimeämä tai siitä suoraan erotettava taito
    assessment_refined: arviointikriteeri/tukimateriaali auttaa hienontamaan
    pedagogically_derived: Sammakon pedagoginen välisolmu tai granulaatio
  relation_type_semantics:
    prerequisite: Osaamiskohteen tiedollinen tai taidollinen esitieto.
    process_support: Prosessitaito tukee työskentelyä mutta ei ole automaattisesti avausportti.
    representation_support: Representaatiotaito tukee ymmärtämistä tai ilmaisua.
    safety_gate: Turvallisuusehto käytännön/kokeelliselle toiminnalle; ei käsitteellisen osaamisen hard prerequisite.
    transfer_bridge: Soveltamista tukeva yhteys.
    enrichment: Syventävä yhteys.
  refactor_lineage:
    base_catalog: Physics_KC_Catalog_7_9_v0.1
    node_audit: STEM_KC_NODE_AUDIT_v0.1
    refactor_generation: STEM_KC_Catalogs_v0.2
    policy: Apply high-confidence granularity/foundation/parent changes; retain original IDs as integration nodes when split;
      do not apply medium-confidence split candidates automatically.
  node_kind_semantics:
    foundation: Pedagoginen perustaito, joka voi toimia globaalina oppimisen lähtöpisteenä.
    concept: Yksi erikseen hallittava käsite tai abstraktio.
    procedure: Yksi erikseen harjoiteltava menettely, algoritmi tai suoritus.
    representation: Matemaattisen tai luonnontieteellisen tiedon esitystapa tai esitysten välinen muunnos.
    process_skill: Sisältöalueiden läpi kulkeva työskentely-, päättely-, tutkimus- tai strateginen taito.
    integration: Koostenooodi, jonka hallinta edellyttää määriteltyjen atomisempien alinoodeiden yhdistämistä.
  entry_role_semantics:
    foundation: Voidaan aloittaa ilman aiempaa muodollista sisältö-KC:tä; arkikieli ja tavallinen havaintokyky sallitaan.
    domain_entry: Ei globaali foundation, mutta voidaan esitellä ilmiö-/kontekstipohjaisesti ilman hard prerequisitea; strong/helpful-tukia
      voi olla.
    dynamic: Prosessi-/representaatiotaito, jonka todellinen konteksti määräytyy tehtäväinstanssista.
    operational: Turvallisuus- tai toimintavalmius, joka voi olla käytännön tekemisen portti mutta ei käsitteellisen oppimisen
      hard prerequisite.
    none: Ei ole aloitusroolissa.
  mastery_role_semantics:
    atomic: Tavoitteena oma itsenäinen mastery-tila.
    integration: Koostaa useita atomisia KC:itä; mastery johdetaan alinoodeista ja erillisestä soveltamisnäytöstä.
    process: Evidenssiä kertyy useissa sisältökonteksteissa; ei välttämättä lineaarinen sisältömastery.
    operational: Turvallisuus/toimintakyky; voidaan käyttää suoritusporttina.
    placeholder: Paikallisen OPS:n tai myöhemmän lähdevalinnan täsmennettävä väliaikainen rakenne.
  concept_path_semantics: Hierarkkinen taksonomiapolku. parent_concept säilyy välittömänä leaf-parenttina; concept_path estää
    taksonomian jäämisen litteäksi.
  foundation_semantics_v0_2: foundation_entry=true vain aidolle globaalille pedagogiselle lähtöpisteelle. zero_required_indegree
    ei yksin tee foundationia.
  integration_semantics_v0_2: Splitattu alkuperäinen ID säilytetään yhteensopivana integration-noodina. Uudet atomisemmat
    lapset kantavat varsinaisen hienojakoisen mastery-tilan.
