catalog:
  id: Math_KC_Catalog_1_6_v0.4
  version: '0.4'
  status: pre-MVP refactored candidate baseline
  scope: Suomen perusopetuksen matematiikka, vuosiluokkakokonaisuudet 1–2 ja 3–6
  language: fi
  generated_at: '2026-10-05'
  time_locked_note: v0.3 on hyväksytyn v0.2 edge audit -patchin soveltava pre-MVP-baseline. Se on voimassa olevan POPS 2014
    -rakenteen pohjalta tehty pedagoginen osaamisverkko, ei OPH:n määräämä opetusjärjestys. Vuoden 2028 uudistus ei vielä
    ole tämän katalogin normatiivinen lähde.
  granularity_rule: Oma noodi muodostetaan, kun taitoa on mielekästä diagnosoida, opettaa, arvioida tai kerrata erikseen;
    tai kun sillä on eri esitiedot, virhekäsitykset, representaatiot tai korjaava polku.
  source_basis_enum:
    direct_curriculum: Perustuu suoraan OPS:ssa nimettyyn sisältöön/taitoon; noodiin tehty hienojakoisuus on silti Sammakon
      mallinnusta.
    assessment_refined: Laaja OPS-sisältö on tarkennettu OPH:n 6. vuosiluokan arviointitukimateriaalin avulla.
    pedagogically_derived: Pedagoginen väli- tai osataito, joka on johdettu oppimisverkon toimivuuden vuoksi.
  prerequisite_semantics:
    required: Tarvitaan normaalisti ennen noodin itsenäistä hallintaa.
    strong: Erittäin hyödyllinen esitieto, mutta puute voidaan korjata noodin sisällä.
    helpful: Tukee oppimista, mutta ei ole etenemisen portti.
  root_semantics: zero_required_indegree on laskennallinen graafiominaisuus. foundation_entry on erillinen pedagoginen päätös.
    Noodi voi olla zero_required_indegree=true mutta foundation_entry=false, esimerkiksi prosessitaito tai dynaamisesti tilanteesta
    riippuva taito.
  node_kind_semantics:
    foundation: Pedagoginen perustaito, joka voi toimia globaalina oppimisen lähtöpisteenä.
    concept: Yksi erikseen hallittava käsite tai abstraktio.
    procedure: Yksi erikseen harjoiteltava menettely, algoritmi tai suoritus.
    representation: Matemaattisen tai luonnontieteellisen tiedon esitystapa tai esitysten välinen muunnos.
    process_skill: Sisältöalueiden läpi kulkeva työskentely-, päättely-, tutkimus- tai strateginen taito.
    integration: Koostenooodi, jonka hallinta edellyttää määriteltyjen atomisempien alinoodeiden yhdistämistä.
  relation_type_semantics:
    prerequisite: Varsinainen osaamiskohteiden välinen esitietosuhde.
    representation_support: Esitystapa helpottaa tai mahdollistaa työskentelyä, mutta ei ole automaattisesti hard gate.
    process_support: Yleinen prosessi- tai päättelytaito tukee sisältönoodia.
    transfer_bridge: Yhteys auttaa soveltamaan osaamista toiseen kontekstiin tai osa-alueeseen.
    enrichment: Syventävä yhteys; ei ydinetenemisen esitieto.
  prerequisite_group_semantics:
    all_of: Kaikki ryhmän noodit tarvitaan ennen hard-gate-avausta.
    any_of: Vähintään yksi ryhmän noodeista riittää hard-gate-avausta varten.
    between_groups: Kaikki prerequisite_groups-listan ryhmät yhdistetään AND-logiikalla.
  audit_lineage:
    base: Math_KC_Catalog_1_6_v0.2
    accepted_patch: Math_KC_Catalog_1_6_v0.2_EDGE_AUDIT_PATCH
    applied_operations: 130
    review_only_items_carried_forward:
    - M-DATA-12
    - M-GEO-22
    - M-GEO-11
    - M-GEO-12
    - M-DATA-11
    - M-GMEAS-01
    - M-GEO-24
  refactor_lineage:
    base_catalog: Math_KC_Catalog_1_6_v0.3
    node_audit: STEM_KC_NODE_AUDIT_v0.1
    refactor_generation: STEM_KC_Catalogs_v0.2
    policy: Apply high-confidence granularity/foundation/parent changes; retain original IDs as integration nodes when split;
      do not apply medium-confidence split candidates automatically.
  entry_role_semantics:
    foundation: Voidaan aloittaa ilman aiempaa muodollista sisältö-KC:tä; arkikieli ja tavallinen havaintokyky sallitaan.
    domain_entry: Ei globaali foundation, mutta voidaan esitellä ilmiö-/kontekstipohjaisesti ilman hard prerequisitea; strong/helpful-tukia
      voi olla.
    dynamic: Prosessi-/representaatiotaito, jonka todellinen konteksti määräytyy tehtäväinstanssista.
    operational: Turvallisuus- tai toimintavalmius, joka voi olla käytännön tekemisen portti mutta ei käsitteellisen oppimisen
      hard prerequisite.
    none: Ei ole aloitusroolissa.
  mastery_role_semantics:
    atomic: Tavoitteena oma itsenäinen mastery-tila.
    integration: Koostaa useita atomisia KC:itä; mastery johdetaan alinoodeista ja erillisestä soveltamisnäytöstä.
    process: Evidenssiä kertyy useissa sisältökonteksteissa; ei välttämättä lineaarinen sisältömastery.
    operational: Turvallisuus/toimintakyky; voidaan käyttää suoritusporttina.
    placeholder: Paikallisen OPS:n tai myöhemmän lähdevalinnan täsmennettävä väliaikainen rakenne.
  concept_path_semantics: Hierarkkinen taksonomiapolku. parent_concept säilyy välittömänä leaf-parenttina; concept_path estää
    taksonomian jäämisen litteäksi.
  foundation_semantics_v0_2: foundation_entry=true vain aidolle globaalille pedagogiselle lähtöpisteelle. zero_required_indegree
    ei yksin tee foundationia.
  integration_semantics_v0_2: Splitattu alkuperäinen ID säilytetään yhteensopivana integration-noodina. Uudet atomisemmat
    lapset kantavat varsinaisen hienojakoisen mastery-tilan.
  external_prerequisite_catalogs: []
